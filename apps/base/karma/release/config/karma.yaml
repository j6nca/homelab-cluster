alertmanager:
  interval: 60s
  servers:
    - name: homelab
      uri: http://vmalertmanager-vmks-victoria-metrics-k8s-stack.observability:9093
      timeout: 10s
      readonly: true

# Do not expose alert annotations in Karma's UI or API responses.
annotations:
  strip:
    - ".*"

# Hide suppressed alerts by default without removing them from Alertmanager.
filters:
  default:
    - "@state!=suppressed"

# Split the dashboard into severity grids without changing notification routing.
ui:
  multiGridLabel: severity
  collapseGroups: collapsedOnMobile
  alertsPerGroup: 5
