# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app goldpinger
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: *app
        namespace: flux-system
      version: 1.0.1
  interval: 15m
  # values.yaml
  values:
    # Runs as a DaemonSet on every node; tolerate the AI node's taint so it
    # keeps pinging from there.
    tolerations:
      - key: ai
        operator: Equal
        value: "true"
        effect: NoSchedule
