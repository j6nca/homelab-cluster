---
# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app traccar
  namespace: flux-system
spec:
  components:
    - ../../../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      POSTGRES_REPLICAS: "1"
      # Positions are the bulk of it: a row per report, so a phone on a 30s
      # interval is ~100k rows a month. Traccar has no retention by default;
      # Longhorn can grow this but never shrink it.
      POSTGRES_SIZE: 2Gi
  targetNamespace: *app
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/tools/traccar/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
