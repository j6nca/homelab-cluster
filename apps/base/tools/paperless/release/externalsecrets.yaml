---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # password comes from the paperless-postgres item, shared with the
        # CNPG cluster's managed role (components/postgres externalsecret), so
        # the string paperless dials with and the one the role is created with
        # cannot drift.
        PAPERLESS_DBHOST: paperless-postgres-rw
        PAPERLESS_DBNAME: paperless
        PAPERLESS_DBUSER: "{{ .username }}"
        PAPERLESS_DBPASS: "{{ .password }}"
        PAPERLESS_REDIS: redis://paperless-dragonfly:6379
        # Signs sessions. Without it Django generates one per process, so
        # every restart signs everybody out -- and with more than one replica
        # they would reject each other's cookies.
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"

        # --- Authentik SSO -------------------------------------------------
        # allauth is off by default; both of these are required to turn it on
        # at all.
        PAPERLESS_ENABLE_ALLAUTH: "true"
        PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
        # A JSON blob rather than discrete variables, which is paperless's own
        # shape, not a choice made here.
        #
        # The Authentik provider's redirect URI must be exactly:
        #
        #   http://paperless.j6n.internal/accounts/oidc/authentik/login/callback/
        #
        # Three parts of that are load-bearing. "authentik" is the provider_id
        # below and appears in the path, so the two move together. The scheme
        # is http because envoy-internal has no TLS listener -- PAPERLESS_URL
        # says the same. And the trailing slash is Django's, which Authentik
        # matches literally.
        #
        # This is allauth's callback shape, not a paperless one. /sso/callback
        # is what litellm uses and does not exist here.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
          {"openid_connect":{"APPS":[{"provider_id":"authentik",
          "name":"Authentik",
          "client_id":"{{ .client_id }}",
          "secret":"{{ .client_secret }}",
          "settings":{"server_url":"https://auth.j6n.dev/application/o/paperless/.well-known/openid-configuration"}}]}}
        # Local login stays reachable. An OIDC misconfiguration otherwise
        # locks out the only account that could fix it, and the admin created
        # at first boot is a local one.
        PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
        # Maps an Authentik user onto an existing paperless user by email
        # rather than creating a second account for the same person.
        PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  data:
    # Explicit refs rather than a dataFrom extract: an extract renders a
    # missing or renamed field as an empty string, and an empty client_id
    # fails at sign-in rather than at deploy.
    - secretKey: secret_key
      remoteRef:
        key: *app
        property: secret_key
    - secretKey: client_id
      remoteRef:
        key: paperless-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: paperless-oidc
        property: client_secret
    - secretKey: username
      remoteRef:
        key: paperless-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: paperless-postgres
        property: password
