---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  # The postgres and dragonfly components append cnpg and dragonfly-operator
  # here, so this has to exist for their patch to have somewhere to add to.
  dependsOn: []
  interval: 15m
  values:
    deployments:
      app:
        image:
          registry: ghcr.io
          repository: paperless-ngx/paperless-ngx
          tag: 2.20.1
          pullPolicy: IfNotPresent

        # 0.3.0 dropped the built-in reloader annotation, and the whole
        # configuration arrives through envFrom -- database, secret key and
        # the Authentik client -- so a rotation only takes effect on restart.
        annotations:
          reloader.stakater.com/auto: "true"

        containerName: *app

        # One, and not negotiable while the data volume is ReadWriteOnce: a
        # second pod would sit unschedulable waiting for a volume the outgoing
        # one still holds. Recreate for the same reason.
        replicas: 1
        strategy:
          type: Recreate

        podSecurityContext:
          # The image starts as root to fix ownership on its volumes and drops
          # to this uid itself, so runAsNonRoot is deliberately absent --
          # forcing it crashloops the container before paperless starts. The
          # fsGroup is what lets it write to the NFS claims.
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch

        env:
          - name: PAPERLESS_TIME_ZONE
            value: America/Toronto
          - name: PAPERLESS_OCR_LANGUAGE
            value: eng
          # Required behind a proxy. Django validates Host and the CSRF origin
          # against this, and without it every form POST fails with a CSRF
          # error while GETs work -- which reads as the app being broken
          # rather than as a missing setting.
          - name: PAPERLESS_URL
            value: http://paperless.j6n.internal
          # What actually decides the scheme of the OIDC redirect_uri.
          # Paperless defaults this to https (settings.py), and allauth's
          # build_absolute_uri() rewrites the scheme of every URL it builds
          # whenever the value is https -- ignoring the scheme of the request
          # that came in. So the callback went to Authentik as
          # https://paperless.j6n.internal/... and was rejected as a mismatch.
          #
          # http here because envoy-internal has no TLS listener. Teaching
          # Authentik to expect https instead would hand the browser a dead
          # endpoint, so the scheme has to come down rather than up.
          #
          # Not PAPERLESS_OAUTH_CALLBACK_BASE_URL, which was tried here first
          # and does nothing for SSO: it is read only by paperless_mail/oauth.py
          # for the Gmail and Outlook mail-ingest flows.
          - name: PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL
            value: http
          # OCR only what has no text layer. Most scanners and every digital
          # PDF already carry one, so the default of redoing it wholesale is
          # the single biggest waste of CPU at ingest.
          - name: PAPERLESS_OCR_MODE
            value: skip
          # The product of these two must not exceed the node's core count.
          # Above it, paperless is not merely slower -- workers contend and
          # ingest falls off a cliff.
          - name: PAPERLESS_TASK_WORKERS
            value: "2"
          - name: PAPERLESS_THREADS_PER_WORKER
            value: "2"

        envFrom:
          # Database, secret key, and the Authentik OIDC provider block
          - secretRef:
              name: *app

        ports:
          - containerPort: 8000
            name: http
            protocol: TCP

        # Generous, because a cold start runs migrations and opens the search
        # index before it answers.
        livenessProbe:
          httpGet:
            path: &health /accounts/login/
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: *health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10

        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            # OCR is the memory-hungry part, and it scales with workers times
            # threads rather than with library size.
            memory: 4Gi

        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: paperless-data
          - name: media
            persistentVolumeClaim:
              claimName: paperless-media
          - name: consume
            persistentVolumeClaim:
              claimName: paperless-consume
          - name: tmp
            emptyDir: {}

        volumeMounts:
          - name: data
            mountPath: /usr/src/paperless/data
          - name: media
            mountPath: /usr/src/paperless/media
          - name: consume
            mountPath: /usr/src/paperless/consume
          - name: tmp
            mountPath: /tmp

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8000
            targetPort: http
            protocol: TCP
            name: http
