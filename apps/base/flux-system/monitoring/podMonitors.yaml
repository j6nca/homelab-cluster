# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  labels:
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
          - image-automation-controller
          - image-reflector-controller
  podMetricsEndpoints:
    - port: http-prom
---
# flux-operator's own metrics: flux_instance_info carries the running Flux
# distribution (revision="v2.7.5@sha256:..."), which the kromgo flux_version
# badge reads, plus flux_resource_info for every Flux object it tracks.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-operator
  labels:
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  podMetricsEndpoints:
    - port: http-metrics
