# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # Cluster-internal RPC. Single node today, so nothing else speaks it,
        # but garage refuses to start without one.
        GARAGE_RPC_SECRET: "{{ .rpc_secret }}"
        # Guards the admin API on :3903, which is what the init job drives.
        GARAGE_ADMIN_TOKEN: "{{ .admin_token }}"
  data:
    # Explicit refs rather than a dataFrom extract: an extract renders a
    # missing or renamed field as an empty string, and an empty rpc_secret is
    # a boot failure rather than a config warning.
    - secretKey: rpc_secret
      remoteRef:
        key: *app
        property: rpc_secret
    - secretKey: admin_token
      remoteRef:
        key: *app
        property: admin_token
---
# The S3 identity volsync uses. Kept separate from the server's own secret so
# the credential can be rotated without restarting garage, and so the init job
# can import exactly the key the movers will present rather than generating
# one garage-side that nothing else knows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-volsync-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: garage-volsync
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: garage-volsync
        property: secret_access_key
