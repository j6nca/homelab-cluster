# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-tunnel
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
      version: 0.3.2
  interval: 15m
  # The chart has no env/extraArgs values, so pin the edge to IPv4 here.
  # cloudflared 2026.4.0 changed --edge-ip-version's default from 4 to auto
  # (whichever family the resolver returns first); pods in this cluster have
  # no IPv6 route, so an AAAA-first answer would leave the tunnel unable to
  # reach the edge, and with one replica that takes every public route down.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cloudflare-tunnel
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env
                value:
                  - name: TUNNEL_EDGE_IP_VERSION
                    value: "4"
  values:
    # The chart is unmaintained: 0.3.2 is its newest release and still
    # defaults to cloudflared 2024.8.3, so the image is overridden here.
    # Pinned by digest: the tag says which release, the digest is what
    # actually gets pulled. Release notes live in RELEASE_NOTES and
    # CHANGES.md in cloudflare/cloudflared, not on the GitHub release.
    image:
      repository: cloudflare/cloudflared
      tag: 2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    cloudflare:
      tunnelName: "k8s-lab"
      # If defined, no secret is created for the credentials, and instead, the secret referenced is used
      secretName: cloudflare-tunnel-credentials
      # If true, turn on WARP routing for TCP
      enableWarp: true
      # Define ingress rules for the tunnel. See
      # https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/configuration/configuration-file/ingress
      ingress:
        # Everything public goes to the external gateway, which routes by hostname
        # from the 28 HTTPRoutes across this repo. The service name is pinned in
        # envoy-gateway/network/envoyproxies.yaml precisely so this can target it.
        #
        # This replaces two per-hostname rules that had stopped reflecting reality:
        # the gatus one never worked (it was added, found to do nothing, and left),
        # and the grafana one was redundant since grafana has its own HTTPRoute. A
        # committed list that does not match the running config is worse than no
        # list — a Flux reconcile would have replaced the wildcard with those two
        # rules and taken every other public hostname down with it, lobby.j6n.dev
        # included.
        - hostname: "*.j6n.dev"
          service: http://envoy-external.network.svc.cluster.local:80
        - hostname: "*.thanoslabs.org"
          service: http://envoy-external.network.svc.cluster.local:80
    replicaCount: 1
