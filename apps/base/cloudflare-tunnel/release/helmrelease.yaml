---
# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: thanoslabs
        namespace: flux-system
      version: 0.4.1
  interval: 15m
  values:
    configmaps:
      config:
        data:
          config.yaml: |
            tunnel: k8s-lab
            credentials-file: /etc/cloudflared/credentials/credentials.json
            metrics: 0.0.0.0:2000
            warp-routing:
              enabled: true
            ingress:
              - hostname: "*.j6n.dev"
                service: http://envoy-external.network.svc.cluster.local:80
              - hostname: "*.thanoslabs.org"
                service: http://envoy-external.network.svc.cluster.local:80
              - service: http_status:404
    deployments:
      app:
        metadata:
          labels: &labels
            app.kubernetes.io/name: cloudflare-tunnel
            app.kubernetes.io/instance: cloudflare-tunnel
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels: *labels
          template:
            metadata:
              labels: *labels
            spec:
              automountServiceAccountToken: false
              containers:
                - name: cloudflared
                  image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
                  args:
                    - tunnel
                    - --no-autoupdate
                    - --config
                    - /etc/cloudflared/config/config.yaml
                    - run
                  ports:
                    - name: metrics
                      containerPort: 2000
                      protocol: TCP
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: metrics
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /ready
                      port: metrics
                    initialDelaySeconds: 10
                    periodSeconds: 20
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      memory: 256Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                    - name: config
                      mountPath: /etc/cloudflared/config
                      readOnly: true
                    - name: credentials
                      mountPath: /etc/cloudflared/credentials
                      readOnly: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              volumes:
                - name: config
                  configMap:
                    name: cloudflare-tunnel-config
                - name: credentials
                  secret:
                    secretName: cloudflare-tunnel-credentials
    services:
      metrics:
        metadata:
          labels:
            app.kubernetes.io/name: cloudflare-tunnel
            app.kubernetes.io/instance: cloudflare-tunnel
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: cloudflare-tunnel
            app.kubernetes.io/instance: cloudflare-tunnel
          ports:
            - name: metrics
              port: 2000
              targetPort: metrics
              protocol: TCP
