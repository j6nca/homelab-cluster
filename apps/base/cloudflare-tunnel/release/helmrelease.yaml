# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-tunnel
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
      version: 0.3.2
  interval: 15m
  values:
    cloudflare:
      tunnelName: "k8s-lab"
      # If defined, no secret is created for the credentials, and instead, the secret referenced is used
      secretName: cloudflare-tunnel-credentials
      # If true, turn on WARP routing for TCP
      enableWarp: true
      # Define ingress rules for the tunnel. See
      # https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/configuration/configuration-file/ingress
      ingress:
        # Everything public goes to the external gateway, which routes by hostname
        # from the 28 HTTPRoutes across this repo. The service name is pinned in
        # envoy-gateway/network/envoyproxies.yaml precisely so this can target it.
        #
        # This replaces two per-hostname rules that had stopped reflecting reality:
        # the gatus one never worked (it was added, found to do nothing, and left),
        # and the grafana one was redundant since grafana has its own HTTPRoute. A
        # committed list that does not match the running config is worse than no
        # list — a Flux reconcile would have replaced the wildcard with those two
        # rules and taken every other public hostname down with it, lobby.j6n.dev
        # included.
        - hostname: "*.j6n.dev"
          service: http://envoy-external.network.svc.cluster.local:80
    replicaCount: 1
