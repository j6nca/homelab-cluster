# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/apps/deployment_v1.json
---
# TEMPORARY. Delete this file and restore home-assistant's replicas once the
# config has been migrated off the standalone node -- see the exit commit
# referenced in the PR, which is a straight `git revert`.
#
# Exists so the migration is a merge and a revert rather than a sequence of
# kubectl commands run from someone's laptop. What the cluster is doing is then
# visible in git at every point, including the part where Home Assistant is
# deliberately down.
#
# A plain Deployment rather than the app-template chart: nothing here outlives
# the migration, and a throwaway is clearer as fifteen obvious lines than as
# chart values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-restore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-restore
    spec:
      containers:
        - name: shell
          image: alpine:3.22
          # Idle: everything happens through `kubectl exec`. A Deployment
          # rather than a bare Pod so a crash or an evicted node brings it
          # back rather than ending the migration halfway through.
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            # The same volume home-assistant uses. It is ReadWriteOnce, which
            # is exactly why home-assistant is scaled to 0 alongside this:
            # both pods running means one stays Pending, and which one is a
            # race.
            claimName: home-assistant
