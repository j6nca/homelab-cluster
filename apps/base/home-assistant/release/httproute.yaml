# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/group: Home
    gethomepage.dev/icon: home-assistant.png
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=home-assistant
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Home
      url: http://home-assistant.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  # Internal only, deliberately. Home Assistant has no OIDC of its own, so it
  # cannot sit behind Authentik the way the other externally published
  # services do -- and with cameras and locks attached it is the worst
  # candidate in the cluster for being reachable on its own auth alone.
  #
  # If it is published later, the answer is a Cloudflare Access policy in
  # front of hass.j6n.dev, plus `http.use_x_forwarded_for` and
  # `trusted_proxies: 10.244.0.0/16` in configuration.yaml, or HA returns 400
  # to everything arriving through the proxy.
  hostnames:
  # Both resolve. home-assistant.j6n.internal is the name already in use and
  # in anything bookmarked; hass.j6n.internal matches the external name, so
  # the same host is not called two different things depending on which side
  # of the tunnel you are on.
  - home-assistant.j6n.internal
  - hass.j6n.internal
  rules:
  - backendRefs:
    - name: home-assistant
      port: 8123
