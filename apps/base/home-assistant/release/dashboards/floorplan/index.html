<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>House 3D Floorplan · Prototype</title>
<style>
  :root{
    --bg:#0b0d10;
    --panel:rgba(18,21,26,.72);
    --panel-brd:rgba(255,255,255,.09);
    --txt:#eef1f5;
    --dim:#9aa3af;
    --accent:#ffc27a;
    --accent2:#4a90d9;
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1100px 640px at 58% 40%, #171b21 0%, #0d0f13 48%, #060709 100%);
    color:var(--txt); font-family:var(--font);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;cursor:grab;background:transparent}
  #stage:active{cursor:grabbing}

  /* ---------------- room chips ---------------- */
  #chips{position:fixed;inset:0;pointer-events:none;z-index:5}
  .chip{
    position:absolute; top:0; left:0;
    display:flex; align-items:center; gap:8px;
    padding:6px 11px 6px 9px;
    border-radius:999px;
    background:rgba(20,23,28,.74);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 6px 22px rgba(0,0,0,.45);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    font-size:12.5px; font-weight:600; white-space:nowrap;
    pointer-events:auto; cursor:pointer;
    transition:border-color .2s, background .2s, box-shadow .2s;
    will-change:transform;
  }
  /* leader line down to the room anchor */
  .chip::after{
    content:''; position:absolute; left:50%; top:100%; width:1.5px; height:var(--lead,30px);
    transform:translateX(-50%); pointer-events:none;
    background:linear-gradient(rgba(255,190,120,.85), rgba(255,180,107,.22));
  }
  .chip::before{
    content:''; position:absolute; left:50%; top:100%; width:5px; height:5px;
    margin-top:calc(var(--lead,30px) - 2px);
    transform:translateX(-50%); border-radius:50%; pointer-events:none;
    background:rgba(255,180,107,.7); box-shadow:0 0 7px rgba(255,180,107,.55);
  }
  .chip.nolead::before,.chip.nolead::after{display:none}
  .chip:hover{background:rgba(30,34,41,.86);border-color:rgba(255,255,255,.22)}
  .chip .dot{
    width:7px;height:7px;border-radius:50%;background:#4b5360;flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(255,194,122,0);
    transition:background .25s, box-shadow .25s;
  }
  .chip.lit .dot{background:var(--accent);box-shadow:0 0 10px 2px rgba(255,194,122,.75)}
  .chip .cname{color:#e7ebf1}
  .chip .cvals{display:flex;gap:7px;color:#b9c2ce;font-weight:600;font-variant-numeric:tabular-nums}
  .chip .cvals .h{opacity:.75}
  .chip.lit{border-color:rgba(255,194,122,.42);box-shadow:0 6px 26px rgba(255,170,80,.16)}

  /* ---------------- top bar ---------------- */
  .topbar{
    position:fixed;top:18px;left:18px;z-index:10;
    display:flex;align-items:center;gap:14px;
  }
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand .title{font-size:15px;font-weight:700;letter-spacing:.2px}
  .brand .sub{font-size:11px;color:var(--dim);letter-spacing:.35px;text-transform:uppercase}
  #tabs{display:flex;gap:4px;padding:4px;border-radius:999px;
    background:var(--panel);border:1px solid var(--panel-brd);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #tabs button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    font:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
    transition:background .18s,color .18s;
  }
  #tabs button:hover{color:#fff}
  #tabs button.on{background:rgba(255,194,122,.16);color:var(--accent)}

  /* ---------------- weather ---------------- */
  #weather{
    position:fixed;top:18px;right:18px;z-index:10;text-align:right;
    padding:11px 14px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--panel-brd);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    min-width:206px;
  }
  #weather .wtop{display:flex;align-items:center;justify-content:flex-end;gap:10px}
  #weather .big{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  #weather .place{font-size:10px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
  #weather .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:7px;font-size:11px;color:var(--dim)}
  #weather .grid b{color:#dfe4ea;font-weight:600;font-variant-numeric:tabular-nums}
  #weather .row{display:flex;justify-content:flex-end;align-items:center;gap:6px}
  #weather .clock{font-size:11px;color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:.5px}

  /* ---------------- control panel ---------------- */
  #panel{
    position:fixed;left:18px;bottom:18px;z-index:10;width:250px;
    padding:14px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--panel-brd);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    max-height:calc(100vh - 130px);overflow:auto;
  }
  #panel h4{margin:0 0 9px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);font-weight:700}
  .field{margin-bottom:12px}
  .field label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:5px}
  .field label b{color:#dfe4ea;font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;border-radius:2px;
    background:linear-gradient(90deg,#ffc27a33,#ffffff22);outline:none
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(255,194,122,.5)
  }
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .btn{
    flex:1;min-width:66px;appearance:none;font:inherit;font-size:11px;font-weight:600;
    padding:7px 8px;border-radius:9px;cursor:pointer;
    background:rgba(255,255,255,.05);color:var(--dim);
    border:1px solid rgba(255,255,255,.08);
    transition:background .18s,color .18s,border-color .18s;
  }
  .btn:hover{color:#fff;background:rgba(255,255,255,.10)}
  .btn.on{background:rgba(255,194,122,.16);color:var(--accent);border-color:rgba(255,194,122,.4)}
  #lightlist{display:flex;flex-direction:column;gap:3px;margin-top:2px}
  .lrow{
    display:flex;align-items:center;gap:8px;text-align:left;
    appearance:none;font:inherit;font-size:11.5px;font-weight:600;
    padding:6px 8px;border-radius:8px;cursor:pointer;
    background:transparent;color:var(--dim);border:1px solid transparent;
    transition:background .15s,color .15s;
  }
  .lrow:hover{background:rgba(255,255,255,.06);color:#fff}
  .lrow .ldot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid #4a525f;flex:0 0 auto;transition:background .2s,border-color .2s}
  .lrow.on{color:#f0e2cc;background:rgba(255,194,122,.10);border-color:rgba(255,194,122,.22)}
  .lrow.on .ldot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(255,194,122,.8)}
  #litcount{float:right;color:var(--accent);font-variant-numeric:tabular-nums}

  /* ---------------- hint / loading ---------------- */
  #hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9;
    font-size:11.5px;color:rgba(255,255,255,.55);letter-spacing:.3px;
    background:rgba(15,17,21,.5);padding:7px 14px;border-radius:999px;
    border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(8px);white-space:nowrap
  }
  #loading{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--dim);font-size:13px;letter-spacing:.4px;
    transition:opacity .5s;
  }
  #loading.hidden{opacity:0;pointer-events:none}
  @media (max-width:820px){
    #panel{width:calc(100vw - 36px);max-height:38vh}
    #weather{min-width:150px;padding:10px 12px}
    #weather .big{font-size:28px}
    #hint{display:none}
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="chips"></div>

  <div class="topbar">
    <div class="brand">
      <span class="title">Homelab House</span>
      <span class="sub">3-D floorplan prototype</span>
    </div>
    <div id="tabs">
      <button data-floor="0">Basement</button>
      <button data-floor="1">1st Floor</button>
      <button data-floor="2">2nd Floor</button>
      <button data-floor="all">All Floors</button>
    </div>
  </div>

  <div id="weather">
    <div class="wtop">
      <div>
        <div class="place">Outside · j6n.internal</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="big" id="wtemp">--</div>
    </div>
    <div class="grid">
      <div class="row">Humidity <b id="whum">--</b></div>
      <div class="row">Wind <b id="wwind">--</b></div>
      <div class="row">Load <b id="wpwr">--</b></div>
      <div class="row">Lights <b id="litcount">--</b></div>
    </div>
  </div>

  <aside id="panel">
    <div class="field">
      <label>Time of day <b id="timelabel"></b></label>
      <input id="timeslider" type="range" min="0" max="23.99" step="0.05" value="21.5" />
    </div>

    <h4>Scene</h4>
    <div class="btnrow">
      <button class="btn" id="auto">Auto lights</button>
      <button class="btn" id="away">Away</button>
    </div>
    <div class="btnrow">
      <button class="btn" id="doors">Doors</button>
      <button class="btn" id="rotate">Rotate</button>
      <button class="btn" id="chipsToggle">Labels</button>
    </div>
    <div class="btnrow">
      <button class="btn" id="allOn">All on</button>
      <button class="btn" id="allOff">All off</button>
      <button class="btn" id="reset">Reset view</button>
    </div>

    <div class="field">
      <label>Light intensity <b id="lmlabel"></b></label>
      <input id="lightmul" type="range" min="0" max="3" step="0.05" value="1" />
    </div>
    <div class="field">
      <label>Exposure <b id="exlabel"></b></label>
      <input id="exposure" type="range" min="0.4" max="2.2" step="0.02" value="1.10" />
    </div>

    <h4>Rooms <span id="litcount2"></span></h4>
    <div id="lightlist"></div>
  </aside>

  <div id="hint">Click a room to toggle its light · drag to orbit · scroll to zoom · shift-drag to pan · keys 1/2/3/0, D, L, R</div>
  <div id="loading">building the house…</div>

  <script>
    // surface load-time failures in the document title so headless checks can see them
    window.addEventListener('error', function (e) { var st = e.error && e.error.stack ? e.error.stack.replace(/\n/g,' <- ').slice(0,400) : e.message; document.title = 'JSERR: ' + st; });
  </script>
  <script src="three.min.js"></script>
  <script src="data.js?v=3"></script>
  <script src="build.js?v=3"></script>
  <script src="ha.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
