# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      home-assistant:
        # TEMPORARY: 0 for the migration. The config volume is ReadWriteOnce,
        # so Home Assistant has to let go of it before restore-helper.yaml can
        # mount it -- with both at 1 replica, one pod stays Pending and which
        # one is a race. Back to 1 in the exit commit.
        replicas: 0
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.7.0
            env:
              TZ: America/Toronto
            ports:
              - containerPort: &port 8123
                name: http
                protocol: TCP
            securityContext:
              # Needed for the Zigbee dongle, not for HA itself. A hostPath
              # character device is visible inside the container but the
              # device cgroup denies read and write to it unless the
              # container is privileged, so ZHA would see /dev/zigbee and get
              # EPERM opening it -- which surfaces as the integration failing
              # to set up rather than as a permissions error.
              #
              # The hardening path is a device plugin (smarter-device-manager
              # advertises devices as extended resources, no privilege
              # needed). That is a DaemonSet and a second moving part; worth
              # revisiting if anything else ever needs a host device.
              privileged: true

    # No non-root securityContext: the official image's s6-overlay init
    # requires root at startup (it drops privileges itself); forcing
    # runAsNonRoot crashloops the pod before HA starts.

    defaultPodOptions:
      # The dongle is physically in one machine, so the pod has to land
      # there. A label rather than a hostname, so the manifest does not carry
      # a machine name that changes when hardware does.
      #
      # The label is set declaratively in talos/patches/nodes/zigbee-host.yaml
      # rather than with `kubectl label`, so a rebuilt node comes back already
      # carrying it.
      #
      # With the label absent the pod stays Pending, which is the right
      # failure -- HA running without its coordinator would mark every Zigbee
      # entity unavailable and start firing automations off stale state.
      nodeSelector:
        zigbee: "true"

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        globalMounts:
          - path: /config
            readOnly: false
        type: persistentVolumeClaim
        storageClass: longhorn
        # The migrated config is ~300 MB, most of it the recorder database.
        # Sized small deliberately: Longhorn can grow a volume but Kubernetes
        # can never shrink one, so starting under and expanding is the
        # reversible direction. Growing needs a healthy volume, so watch
        # replica health before letting it get close to full.
        size: 1Gi
        accessMode: ReadWriteOnce
      # The Zigbee coordinator: the /dev/zigbee symlink created by the udev
      # rule in talos/patches/global/zigbee-usb.yaml, mounted at /dev/ttyUSB0.
      #
      # The two names are deliberately different. On the host, /dev/zigbee is
      # stable -- the kernel name moves depending on which driver binds and
      # what else is plugged in. Inside, /dev/ttyUSB0 is what the standalone
      # node presented (docker mapped the by-id path to /dev/ttyUSB0), so it
      # is what ZHA has stored in its config entry. Matching it means the
      # migrated config works untouched, instead of needing the device path
      # rewritten in .storage before first boot.
      zigbee:
        type: hostPath
        hostPath: /dev/zigbee
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/ttyUSB0
      tmp:
        type: emptyDir
