# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Keys are the Terraform variable names in terraform/github-pages/variables.tf;
# varsFrom on the Terraform CR maps them 1:1. Explicit data refs on purpose:
# dataFrom across items silently clobbers fields that share a name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pages-terraform
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
    # GitHub App with Pages: write + Administration: write, installed on
    # thanoslabs and j6nca (each installation has its own ID)
    - secretKey: github_app_id
      remoteRef:
        key: github-pages-app
        property: app-id
    - secretKey: github_app_pem
      remoteRef:
        key: github-pages-app
        property: private-key
    - secretKey: github_installation_id_thanoslabs
      remoteRef:
        key: github-pages-app
        property: installation-id-thanoslabs
    - secretKey: github_installation_id_j6nca
      remoteRef:
        key: github-pages-app
        property: installation-id-j6nca
