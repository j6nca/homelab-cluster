---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app searxng
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # settings.yml leaves secret_key empty and SearXNG reads it from here.
        # It signs the request tokens the bot detection uses; an instance with
        # an empty one refuses to start rather than running unprotected.
        SEARXNG_SECRET: "{{ .secret_key }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: *app
        property: secret_key
