# Bot detection. Live now that server.limiter is true in settings.yml.

[real_ip]

# One proxy hop: envoy-internal. With this set the address bot detection sees
# is the LAN client rather than the gateway pod, so one caller cannot exhaust
# an allowance shared by everyone.
x_for = 1

ipv4_prefix = 32
ipv6_prefix = 48

[botdetection.ip_limit]

filter_link_local = true

# The link-token method requires a browser to fetch a token before searching.
# Programmatic clients cannot, and they are the point of this instance.
link_token = false

[botdetection.ip_lists]

# Checked before anything else -- an address here is not rate-limited and is
# not checked for looking like a bot, which every non-browser caller does.
#
# 10.0.0.0/8 covers the pod and service networks: open-webui and anything else
# in-cluster reaches searxng from a pod address. 192.168.0.0/16 covers the LAN
# and the nodes, which matters beyond convenience -- kubelet probes dial the
# pod directly from the node with no proxy headers at all, and a limiter that
# blocked them would crashloop the pod rather than merely refuse a search.
pass_ip = [
  '10.0.0.0/8',
  '192.168.0.0/16',
]

block_ip = []

# The SearXNG organisation's own checkers. Nothing off the LAN reaches this
# instance, so there is nothing for them to check.
pass_searxng_org = false
