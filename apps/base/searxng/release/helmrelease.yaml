---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app searxng
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  dependsOn: []
  interval: 15m
  values:
    deployments:
      app:
        image:
          registry: ghcr.io
          repository: searxng/searxng
          # Digest as well as tag, carried over from the previous pin: the
          # tag says which release this is meant to be and the digest is what
          # actually gets pulled, so a retagged image cannot quietly change
          # what runs.
          tag: 2025.11.18-576c8ca99@sha256:91da34403fc1d2c7ac23d1459af87870d87810b7d50b0c6a4585ab78846cb534
          pullPolicy: IfNotPresent

        # 0.3.0 dropped the built-in reloader annotation, and both the
        # settings configmap and the secret carrying SEARXNG_SECRET are
        # mounted rather than read at request time -- so a change to either
        # only takes effect on restart.
        annotations:
          reloader.stakater.com/auto: "true"

        containerName: *app

        # Stateless: the only writable path is an emptyDir and every request
        # is independent, so there is nothing for two pods to contend over.
        replicas: 2
        # An object, not the bare string app-template accepted -- the generic
        # chart passes this straight into the Deployment spec, where a string
        # is not a valid strategy.
        strategy:
          type: RollingUpdate

        env:
          - name: SEARXNG_PORT
            value: "8080"
          # The dragonfly instance the component provisions. Used for the
          # limiter and for caching; searxng runs without it but re-fetches
          # far more.
          - name: SEARXNG_REDIS_URL
            value: redis://searxng-dragonfly:6379

        envFrom:
          # SEARXNG_SECRET. settings.yml leaves secret_key empty and searxng
          # reads it from the environment.
          - secretRef:
              name: *app

        ports:
          - containerPort: 8080
            name: http
            protocol: TCP

        livenessProbe:
          httpGet:
            path: &health /stats
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: *health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10

        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            # Engine responses are parsed in memory and a broad query fans out
            # to dozens of them at once, so the ceiling is set by the widest
            # search rather than by steady state.
            memory: 1Gi

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        podSecurityContext:
          # 977 is the uid baked into the searxng image.
          runAsUser: 977
          runAsGroup: 977
          runAsNonRoot: true

        volumes:
          - name: config
            configMap:
              name: searxng-configmap
          # Required by readOnlyRootFilesystem: searxng writes its compiled
          # settings and engine caches under /tmp and fails to start without
          # a writable path rather than degrading.
          - name: tmp
            emptyDir: {}

        volumeMounts:
          - name: config
            mountPath: /etc/searxng/settings.yml
            subPath: settings.yml
            readOnly: true
          - name: config
            mountPath: /etc/searxng/limiter.toml
            subPath: limiter.toml
            readOnly: true
          - name: tmp
            mountPath: /tmp

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: http
            protocol: TCP
            name: http
