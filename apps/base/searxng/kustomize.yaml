# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app searxng
  namespace: flux-system
spec:
  components:
    # The HelmRelease already dials searxng-dragonfly for the limiter and
    # cache; without this that host does not exist.
    - ../../../../components/dragonfly
  postBuild:
    substitute:
      APP: *app
      DRAGONFLY_REPLICAS: "1"
      DRAGONFLY_MAX_MEMORY: 512Mi
  # Was kube-system, which is where nothing that is not part of Kubernetes
  # belongs -- and it is the one namespace exempt from Pod Security
  # Admission, so a workload there quietly loses a guardrail it should keep.
  targetNamespace: *app
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/searxng/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
