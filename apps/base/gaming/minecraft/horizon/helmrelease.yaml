# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: horizon
spec:
  suspend: false
  interval: 15m
  chart:
    spec:
      chart: generic
      version: 0.4.1
      sourceRef:
        kind: HelmRepository
        name: thanoslabs
        namespace: flux-system
  values:
    metadata:
      labels:
        app.kubernetes.io/name: horizon
        app.kubernetes.io/instance: horizon
    persistentVolumeClaims:
      data:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: 2Gi
      resources:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: 500Mi
    services:
      minecraft:
        metadata:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: smp.j6n.internal
            metallb.io/address-pool: lan
        spec:
          type: LoadBalancer
          selector:
            app.kubernetes.io/name: horizon
            app.kubernetes.io/instance: horizon
          ports:
            - name: minecraft
              port: 25565
              targetPort: minecraft
              protocol: TCP
      headless:
        spec:
          clusterIP: None
          selector:
            app.kubernetes.io/name: horizon
            app.kubernetes.io/instance: horizon
          ports:
            - name: minecraft
              port: 25565
              targetPort: minecraft
              protocol: TCP
    statefulSets:
      server:
        spec:
          replicas: 1
          serviceName: horizon-headless
          selector:
            matchLabels:
              app.kubernetes.io/name: horizon
              app.kubernetes.io/instance: horizon
          template:
            metadata:
              labels:
                app.kubernetes.io/name: horizon
                app.kubernetes.io/instance: horizon
            spec:
              terminationGracePeriodSeconds: 180
              automountServiceAccountToken: false
              # The dedicated AI node has ai=true; never schedule Minecraft there.
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: ai
                            operator: DoesNotExist
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                fsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              initContainers:
                - name: download-minecraft-server
                  image: python:3.13-alpine
                  imagePullPolicy: IfNotPresent
                  command:
                    - python
                    - -c
                    - |
                      import hashlib
                      import json
                      import os
                      import pathlib
                      import urllib.request

                      version = "26.3"
                      destination = pathlib.Path("/data/minecraft") / f"server_{version}.jar"
                      destination.parent.mkdir(parents=True, exist_ok=True)

                      def get_json(url):
                          with urllib.request.urlopen(url, timeout=30) as response:
                              return json.load(response)

                      manifest = get_json("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
                      entry = next((v for v in manifest["versions"] if v["id"] == version), None)
                      if entry is None:
                          raise SystemExit(f"Minecraft version {version} not found in Mojang manifest")
                      metadata = get_json(entry["url"])
                      server = metadata["downloads"]["server"]
                      expected = server["sha1"]

                      if destination.exists():
                          current = hashlib.sha1(destination.read_bytes()).hexdigest()
                          if current == expected:
                              print(f"Verified existing {destination}")
                              raise SystemExit(0)
                          print("Existing server JAR has an invalid checksum; replacing it")

                      temporary = destination.with_suffix(".jar.tmp")
                      try:
                          with urllib.request.urlopen(server["url"], timeout=120) as response, temporary.open("wb") as output:
                              digest = hashlib.sha1()
                              while chunk := response.read(1024 * 1024):
                                  output.write(chunk)
                                  digest.update(chunk)
                          if digest.hexdigest() != expected:
                              raise ValueError("Downloaded server JAR SHA-1 mismatch")
                          os.replace(temporary, destination)
                      finally:
                          temporary.unlink(missing_ok=True)
                      print(f"Downloaded and verified {destination}")
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: data
                      mountPath: /data
              containers:
                - name: horizon
                  image: ghcr.io/thanoslabs/horizon-server:0.0.1
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: HORIZON_EULA
                      value: "true"
                    - name: HORIZON_WHITELIST
                      value: "true"
                    - name: HORIZON_NO_AUDIO
                      value: "1"
                  ports:
                    - name: minecraft
                      containerPort: 25565
                      protocol: TCP
                  startupProbe:
                    tcpSocket:
                      port: minecraft
                    failureThreshold: 60
                    periodSeconds: 5
                  readinessProbe:
                    tcpSocket:
                      port: minecraft
                    periodSeconds: 10
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: resources
                      mountPath: /opt/horizon/.local/horizon-client/26.3
                      readOnly: true
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: horizon-data
                - name: resources
                  persistentVolumeClaim:
                    claimName: horizon-resources
