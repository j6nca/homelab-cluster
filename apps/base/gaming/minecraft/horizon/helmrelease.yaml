# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: horizon
spec:
  suspend: false
  interval: 15m
  chart:
    spec:
      chart: generic
      version: 0.4.1
      sourceRef:
        kind: HelmRepository
        name: thanoslabs
        namespace: flux-system
  values:
    metadata:
      labels:
        app.kubernetes.io/name: horizon
        app.kubernetes.io/instance: horizon
    persistentVolumeClaims:
      data:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: 2Gi
      resources:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: 2Gi
    services:
      minecraft:
        metadata:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: smp.j6n.internal
            metallb.io/address-pool: lan
        spec:
          type: LoadBalancer
          selector:
            app.kubernetes.io/name: horizon
            app.kubernetes.io/instance: horizon
          ports:
            - name: minecraft
              port: 25565
              targetPort: minecraft
              protocol: TCP
      headless:
        spec:
          clusterIP: None
          selector:
            app.kubernetes.io/name: horizon
            app.kubernetes.io/instance: horizon
          ports:
            - name: minecraft
              port: 25565
              targetPort: minecraft
              protocol: TCP
    statefulSets:
      server:
        spec:
          replicas: 1
          serviceName: horizon-headless
          selector:
            matchLabels:
              app.kubernetes.io/name: horizon
              app.kubernetes.io/instance: horizon
          template:
            metadata:
              labels:
                app.kubernetes.io/name: horizon
                app.kubernetes.io/instance: horizon
            spec:
              terminationGracePeriodSeconds: 180
              automountServiceAccountToken: false
              # The dedicated AI node has ai=true; never schedule Minecraft there.
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: ai
                            operator: DoesNotExist
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                fsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              initContainers:
                - name: prepare-minecraft-resources
                  image: ghcr.io/thanoslabs/horizon-prepare:0.0.1
                  imagePullPolicy: IfNotPresent
                  # Read the user's existing NAS layout; stage launcher-compatible links in emptyDir.
                  # No Minecraft binaries are downloaded or copied to Longhorn.
                  command:
                    - /bin/sh
                    - -ec
                    - |
                      if horizon-prepare --check --root /opt/horizon --output /resources; then
                        echo "Horizon resources already prepared"
                        exit 0
                      fi
                      test -f /minecraft-source/client/versions/26.3.jar || { echo "Missing client/versions/26.3.jar on NAS"; exit 1; }
                      test -f /minecraft-source/client/versions/26.3.json || { echo "Missing client/versions/26.3.json on NAS"; exit 1; }
                      test -f /minecraft-source/server/26.3/server.jar || { echo "Missing server/26.3/server.jar on NAS"; exit 1; }
                      test -d /minecraft-source/assets || { echo "Missing assets/ on NAS"; exit 1; }
                      test -d /minecraft-source/libraries || { echo "Missing libraries/ on NAS"; exit 1; }
                      mkdir -p /opt/horizon/.local/minecraft/versions/26.3
                      ln -s /minecraft-source/client/versions/26.3.jar /opt/horizon/.local/minecraft/versions/26.3/26.3.jar
                      ln -s /minecraft-source/client/versions/26.3.json /opt/horizon/.local/minecraft/versions/26.3/26.3.json
                      ln -s /minecraft-source/assets /opt/horizon/.local/minecraft/assets
                      ln -s /minecraft-source/libraries /opt/horizon/.local/minecraft/libraries
                      horizon-prepare --prepare \
                        --root /opt/horizon \
                        --minecraft-dir /opt/horizon/.local/minecraft \
                        --server-jar /minecraft-source/server/26.3/server.jar \
                        --output /resources
                      horizon-prepare --check --root /opt/horizon --output /resources
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: resources
                      mountPath: /resources
                    - name: minecraft-source
                      mountPath: /minecraft-source
                      readOnly: true
                    - name: prepare-work
                      mountPath: /opt/horizon/.local
              containers:
                - name: horizon
                  image: ghcr.io/thanoslabs/horizon-server:0.0.2
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: HORIZON_EULA
                      value: "true"
                    - name: HORIZON_WHITELIST
                      value: "true"
                    - name: HORIZON_NO_AUDIO
                      value: "1"
                  ports:
                    - name: minecraft
                      containerPort: 25565
                      protocol: TCP
                  startupProbe:
                    tcpSocket:
                      port: minecraft
                    failureThreshold: 60
                    periodSeconds: 5
                  readinessProbe:
                    tcpSocket:
                      port: minecraft
                    periodSeconds: 10
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: resources
                      mountPath: /opt/horizon/.local/horizon-client/26.3
                      readOnly: true
              volumes:
                # Confirm the NAS export path is mountable by Kubernetes before merging.
                - name: minecraft-source
                  nfs:
                    server: nasj6n.home
                    path: /volume2/ROMS/minecraft
                    readOnly: true
                - name: prepare-work
                  emptyDir: {}
                - name: data
                  persistentVolumeClaim:
                    claimName: horizon-data
                - name: resources
                  persistentVolumeClaim:
                    claimName: horizon-resources
