# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grafana-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      grafana-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mcp/grafana
              tag: latest
              pullPolicy: Always
            # The image entrypoint is /app/mcp-grafana --transport sse
            # --address 0.0.0.0:8000 (SSE transport, basePath=/). The previous
            # docker-CLI style args were ignored and only misled. The server
            # also defaults -allowed-hosts to loopback variants of --address,
            # which rejects in-cluster clients dialing the Service DNS —
            # allowlist the Service name so LiteLLM can connect.
            args:
              - "-allowed-hosts"
              - "grafana-mcp.mcp:8000"
            env:
              GRAFANA_URL: "http://grafana-service.observability:3000"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            ports:
              - containerPort: &port 8000
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      app:
        ports:
          http:
            port: *port
