# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: main-stable
              pullPolicy: IfNotPresent
            # The litellm image ENTRYPOINT is `litellm`; args are flags only.
            # API keys + master key are injected as env vars (secretRef below)
            # and resolved in config.yaml via `os.environ/...`.
            args:
              - "--config"
              - "/etc/litellm/config.yaml"
              - "--port"
              - "4000"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              # without this the pod counts as Ready the moment the process
              # starts, so envoy routes to it while litellm is still booting
              # and callers get "connection refused" on every restart. The
              # endpoint is public and reports db state without a credential.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # litellm runs prisma migrations against the database on boot,
              # which can outlast the liveness window (20s + 3x30s) on a cold
              # start. A startup probe holds liveness and readiness off until
              # the app answers, so a slow migration can't be mistaken for a
              # hang and killed into a crashloop.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                # 512Mi was the limit and the pod was OOMKilled into a
                # crashloop before it ever bound to 4000. This config loads
                # four MCP servers plus several providers, which a python
                # proxy does not fit in half a gig.
                memory: 768Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}"
        globalMounts:
          - path: /etc/litellm/config.yaml
            subPath: config.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
