# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # Backs the MiniMax subscription that lapses 2026-09-30. The models it
        # serves are marked the same way in configmap.yaml; retire the two
        # together so a key never outlives the block that reads it.
        MINIMAX_API_KEY: "{{ .minimax_api_key }}"
        HYPERCHARM_API_KEY: "{{ .hypercharm_api_key }}"
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        # PAT forwarded to github-mcp as Authorization: Bearer over MCP. Same
        # item/property the github-mcp ExternalSecret uses, so the two could
        # never drift apart.
        GITHUB_MCP_TOKEN: "{{ .github_mcp_token }}"
        # Backs virtual keys, spend logs and SSO users — litellm's SSO
        # callback returns a 500 without it. The role name is fixed by
        # components/postgres (managed role ${APP}), so only the password is
        # looked up; templating the username is how buzz ended up connecting
        # as "anonymous".
        DATABASE_URL: "postgresql://litellm:{{ .pg_password }}@litellm-postgres-rw:5432/litellm"
        # Base URL for links the proxy generates. litellm is internal-only,
        # so this is the LAN name over http (envoy-internal has no TLS
        # listener).
        PROXY_BASE_URL: http://litellm.j6n.internal
        # --- Admin UI SSO (generic OAuth/OIDC via Authentik) ---
        # The Authentik provider's redirect URI must be
        # {PROXY_BASE_URL}/sso/callback, matching exactly — scheme included.
        # http is fine here: litellm derives the session cookie's Secure flag
        # from the request scheme, so it does not mark the cookie Secure over
        # plain http, and the redirect back from auth.j6n.dev is a top-level
        # navigation, which SameSite=Lax permits.
        GENERIC_CLIENT_ID: "{{ .client_id }}"
        GENERIC_CLIENT_SECRET: "{{ .client_secret }}"
        GENERIC_AUTHORIZATION_ENDPOINT: https://auth.j6n.dev/application/o/authorize/
        GENERIC_TOKEN_ENDPOINT: https://auth.j6n.dev/application/o/token/
        GENERIC_USERINFO_ENDPOINT: https://auth.j6n.dev/application/o/userinfo/
        GENERIC_SCOPE: openid email profile
        GENERIC_USER_ID_ATTRIBUTE: sub
        GENERIC_USER_EMAIL_ATTRIBUTE: email
        GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
        # Role comes from Authentik group membership. litellm checks these
        # mappings first and only falls back to GENERIC_USER_ROLE_ATTRIBUTE
        # below, so a per-user litellm_role claim can still override.
        # ROLES is parsed with ast.literal_eval — it must stay a valid python
        # dict literal, and the keys must be literal LitellmUserRoles values.
        GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
        GENERIC_ROLE_MAPPINGS_ROLES: "{'proxy_admin': ['litellm_admin'], 'internal_user': ['litellm_user']}"
        # Applies to anyone in neither group, so it is deliberately the least
        # privileged role rather than internal_user — being authenticated by
        # Authentik should not by itself grant usable access.
        # NB: the least-privileged role is spelled internal_user_viewer.
        # LitellmUserRoles.INTERNAL_USER_VIEW_ONLY is the python member name,
        # not the value — and an invalid value here raises a pydantic
        # ValidationError that litellm only guards with `except TypeError`,
        # so it escapes as a 500 on sign-in rather than a config warning.
        GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: internal_user_viewer
        # Fallback when the group mappings above yield nothing. Authentik must
        # emit this claim with a literal LiteLLM role value
        # (proxy_admin | proxy_admin_viewer | internal_user | internal_user_viewer).
        GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
        # Fallback if SSO is unavailable: username `admin` with the master key
        # as the password (override via UI_USERNAME / UI_PASSWORD).
  data:
    - secretKey: minimax_api_key
      remoteRef:
        key: minimax-api
        property: password
    # The 1Password item is `hypercharm-api`, which is not quite the name the
    # provider goes by. Renaming the item would silently break this ref, so if
    # it ever moves, move both.
    - secretKey: hypercharm_api_key
      remoteRef:
        key: hypercharm-api
        property: password
    - secretKey: litellm_master_key
      remoteRef:
        key: litellm
        property: master_key
    # github-mcp's PAT, same source as apps/base/ai/mcp/github/externalsecrets.yaml.
    - secretKey: github_mcp_token
      remoteRef:
        key: openclaw-gh
        property: pat
    # same item components/postgres points the CNPG managed role at, so the
    # password the proxy dials with and the one the role is created with
    # cannot drift
    - secretKey: pg_password
      remoteRef:
        key: litellm-postgres
        property: password
    # OIDC client credentials, from the `litellm-oidc` 1Password item.
    # Explicit refs rather than a dataFrom extract: an extract silently
    # renders a missing or renamed field as an empty string, which here
    # would mean an empty client_id and an opaque SSO failure.
    - secretKey: client_id
      remoteRef:
        key: litellm-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: litellm-oidc
        property: client_secret
---
# Seed for the ChatGPT-subscription (Codex) OAuth token file.
#
# This is deliberately a Secret separate from the `litellm` one above: that
# Secret is consumed with envFrom, and a key literally named `auth.json` is
# not a valid environment variable name, so it would be rejected as an env
# var before it could ever be mounted as a file.
#
# The value is the contents of ~/.config/litellm/chatgpt/auth.json produced
# by the one-off device-code login (see the init container in
# helmrelease.yaml). It is only a *seed*: the live file lives on the
# chatgpt-tokens PVC, because the ChatGPT provider rewrites it on every token
# refresh and each refresh token is single-use. This copy therefore goes
# stale within ~10 days and must not be treated as the current credential.
# It only matters when the PVC is empty -- a fresh volume, or a re-login
# after the refresh token is rejected.
#
# Sourced from a 1Password Secure Note (vault `lab`, the only vault the
# ClusterSecretStore exposes). The Connect provider matches `property`
# against a field Label and only special-cases category DOCUMENT to files;
# every other category, Secure Note included, is resolved through its
# fields. A Secure Note's body is the field labelled `notesPlain`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-chatgpt-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # Block scalar, not a quoted string: the value is JSON full of
        # double quotes, and ESO executes each template value independently
        # (it does not re-parse the rendered YAML), so the raw bytes survive.
        auth.json: |
          {{ .auth_json }}
  data:
    - secretKey: auth_json
      remoteRef:
        # 1Password Secure Note `openai-auth.json`, body field `notesPlain`.
        key: openai-auth.json
        property: notesPlain
