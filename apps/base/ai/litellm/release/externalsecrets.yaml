# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        MINIMAX_API_KEY: "{{ .minimax_api_key }}"
        HERMES_AGENT_API_KEY: "{{ .hermes_api_key }}"
        OPENCODE_GO_API_KEY: "{{ .opencode_go_api_key }}"
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        # Base URL for links the proxy generates. litellm is internal-only,
        # so this is the LAN name over http (envoy-internal has no TLS
        # listener).
        PROXY_BASE_URL: http://litellm.j6n.internal
        # --- Admin UI SSO (generic OAuth/OIDC via Authentik) ---
        # The Authentik provider's redirect URI must be
        # {PROXY_BASE_URL}/sso/callback, matching exactly — scheme included.
        # http is fine here: litellm derives the session cookie's Secure flag
        # from the request scheme, so it does not mark the cookie Secure over
        # plain http, and the redirect back from auth.j6n.dev is a top-level
        # navigation, which SameSite=Lax permits.
        GENERIC_CLIENT_ID: "{{ .client_id }}"
        GENERIC_CLIENT_SECRET: "{{ .client_secret }}"
        GENERIC_AUTHORIZATION_ENDPOINT: https://auth.j6n.dev/application/o/authorize/
        GENERIC_TOKEN_ENDPOINT: https://auth.j6n.dev/application/o/token/
        GENERIC_USERINFO_ENDPOINT: https://auth.j6n.dev/application/o/userinfo/
        GENERIC_SCOPE: openid email profile
        GENERIC_USER_ID_ATTRIBUTE: sub
        GENERIC_USER_EMAIL_ATTRIBUTE: email
        GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
        # Authentik must emit this claim with a literal LiteLLM role value
        # (proxy_admin | proxy_admin_viewer | internal_user | internal_user_view_only).
        GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
        # Fallback if SSO is unavailable: username `admin` with the master key
        # as the password (override via UI_USERNAME / UI_PASSWORD).
  data:
    - secretKey: hermes_api_key
      remoteRef:
        key: hermes-agent
        property: password
    - secretKey: minimax_api_key
      remoteRef:
        key: minimax-api
        property: password
    - secretKey: opencode_go_api_key
      remoteRef:
        key: opencode-go
        property: password
    - secretKey: litellm_master_key
      remoteRef:
        key: litellm
        property: master_key
    # OIDC client credentials, from the `litellm-oidc` 1Password item.
    # Explicit refs rather than a dataFrom extract: an extract silently
    # renders a missing or renamed field as an empty string, which here
    # would mean an empty client_id and an opaque SSO failure.
    - secretKey: client_id
      remoteRef:
        key: litellm-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: litellm-oidc
        property: client_secret
