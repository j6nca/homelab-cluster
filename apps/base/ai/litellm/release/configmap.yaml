# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: &app litellm
data:
  config.yaml: |
    model_list:
      # --- standalone providers (parity with Bifrost) ---
      # Subscription lapses 2026-09-30. Kept until then; when it goes, drop
      # these two entries, the fast-pool member below, and MINIMAX_API_KEY
      # from externalsecrets.yaml.
      #
      # api.minimaxi.chat, not api.minimax.chat -- note the i. They are two
      # separate deployments, international and mainland China, with separate
      # account systems, so a key issued on one is not a key on the other.
      # The China host answers a valid international key with
      # "invalid api key (2049)", which reads as a dead credential and sent
      # this in the wrong direction once already: the key was fine, the host
      # was wrong.
      - model_name: MiniMax-M3
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimaxi.chat/v1
          api_key: os.environ/MINIMAX_API_KEY

      # Vision model. Only openclaw asked for it, but it has to be listed here
      # to survive openclaw moving off its direct MiniMax provider.
      - model_name: MiniMax-VL-01
        litellm_params:
          model: openai/MiniMax-VL-01
          api_base: https://api.minimaxi.chat/v1
          api_key: os.environ/MINIMAX_API_KEY

      # Two things are deliberately absent here.
      #   hermes-agent: it is a *client* of this proxy, so routing a model back
      #     to it would let a request loop.
      #   jarvis.internal: the local endpoint needs no credential, so proxying
      #     it buys nothing this config exists to provide. Callers that want the
      #     local models dial jarvis.internal directly (hermes-agent's `local`
      #     provider, openclaw's `lemonade` provider), which also means they
      #     keep working when this proxy is down.

      # --- opencode-go models (https://opencode.ai/zen/go/v1) ---
      # Subscription lapses 2026-09-30, same as MiniMax above. When it goes,
      # drop this block, the fast-pool member below, and OPENCODE_GO_API_KEY.
      #
      # x-opencode-session is mandatory, not telemetry: without it the
      # provider refuses the request outright with 400 MissingSessionID. The
      # value is never validated -- any stable non-empty string is accepted --
      # so it is a constant here rather than anything derived.
      #
      # That constant does mean every caller through this proxy shares one
      # session, which costs whatever routing locality the header is meant to
      # buy. The alternative is per-request state litellm has nowhere to keep,
      # so the locality is what gets given up.
      - model_name: glm-5.1
        litellm_params:
          model: openai/glm-5.1
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: glm-5
        litellm_params:
          model: openai/glm-5
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: kimi-k2.5
        litellm_params:
          model: openai/kimi-k2.5
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: kimi-k2.6
        litellm_params:
          model: openai/kimi-k2.6
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: deepseek-v4-pro
        litellm_params:
          model: openai/deepseek-v4-pro
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: deepseek-v4-flash
        litellm_params:
          model: openai/deepseek-v4-flash
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: mimo-v2.5
        litellm_params:
          model: openai/mimo-v2.5
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab
      - model_name: mimo-v2.5-pro
        litellm_params:
          model: openai/mimo-v2.5-pro
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab

      # --- hypercharm (https://hyper.charm.land/v1) ---
      # Plain OpenAI-compatible: bearer key, no extra headers. The catalog is
      # public at GET /v1/models -- consult it rather than this list when
      # something looks missing, since it carries 34 models and only the
      # current-generation ones are wired up here.
      #
      # Every name is prefixed hypercharm/ because seven of the upstream ids
      # (glm-5, glm-5.1, kimi-k2.5, kimi-k2.6, deepseek-v4-flash,
      # deepseek-v4-pro, minimax-m3) are names already served above by the two
      # expiring providers. Two entries sharing a model_name do not conflict in
      # litellm -- they silently become one least-busy pool, exactly as
      # fast-pool below is built -- so bare names here would have quietly
      # spread traffic across two providers of different cost and quality.
      # The prefix keeps the caller's choice of provider explicit.
      #
      # This is also the landing place for 2026-09-30: hypercharm covers what
      # MiniMax and opencode-go serve today, so retiring them is a matter of
      # repointing callers at these names.
      - model_name: hypercharm/qwen3.8-max
        litellm_params:
          model: openai/qwen3.8-max
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.8-flash
        litellm_params:
          model: openai/qwen3.8-flash
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.8-27b
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.8-2.4t-a95b
        litellm_params:
          model: openai/qwen3.8-2.4t-a95b
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.7-max
        litellm_params:
          model: openai/qwen3.7-max
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.7-plus
        litellm_params:
          model: openai/qwen3.7-plus
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.7-flash
        litellm_params:
          model: openai/qwen3.7-flash
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.6-max
        litellm_params:
          model: openai/qwen3.6-max
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.6-plus
        litellm_params:
          model: openai/qwen3.6-plus
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/qwen3.6-flash
        litellm_params:
          model: openai/qwen3.6-flash
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/glm-5.3
        litellm_params:
          model: openai/glm-5.3
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/glm-5.3-flash
        litellm_params:
          model: openai/glm-5.3-flash
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/glm-5.2
        litellm_params:
          model: openai/glm-5.2
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/kimi-k3
        litellm_params:
          model: openai/kimi-k3
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/kimi-k2.7-code
        litellm_params:
          model: openai/kimi-k2.7-code
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/kimi-k2.6
        litellm_params:
          model: openai/kimi-k2.6
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/deepseek-v4.1-flash
        litellm_params:
          model: openai/deepseek-v4.1-flash
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/minimax-m3
        litellm_params:
          model: openai/minimax-m3
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY
      - model_name: hypercharm/inkling
        litellm_params:
          model: openai/inkling
          api_base: https://hyper.charm.land/v1
          api_key: os.environ/HYPERCHARM_API_KEY

      # --- load-balanced pool (least-busy across MiniMax-M3 + deepseek-v4-flash) ---
      - model_name: fast-pool
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimaxi.chat/v1
          api_key: os.environ/MINIMAX_API_KEY
      - model_name: fast-pool
        litellm_params:
          model: openai/deepseek-v4-flash
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_API_KEY
          extra_headers:
            x-opencode-session: litellm-homelab

    router_settings:
      routing_strategy: least-busy

    mcp_servers:
      grafana_mcp:
        # The grafana-mcp pod runs the SSE transport (GET /sse,
        # POST /message), not streamable HTTP at /mcp.
        url: "http://grafana-mcp.mcp:8000/sse"
        transport: sse
      github_mcp:
        # ghcr.io/github/github-mcp-server requires the caller to present the
        # PAT on every request via Authorization: Bearer, even when the
        # server-side GITHUB_PERSONAL_ACCESS_TOKEN env var is set (verified:
        # 401 without the header, 200 with it).
        url: "http://github-mcp.mcp:8082/mcp"
        auth_type: bearer_token
        authentication_token: os.environ/GITHUB_MCP_TOKEN
      context7_mcp:
        # Pod listens on 8080, not the 3000 the Service used to target.
        url: "http://context7-mcp.mcp:8080/mcp"
      kubernetes_mcp:
        url: "http://kubernetes-mcp.mcp:8080/mcp"

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # LiteLLM_SpendLogs gets one row per request and is the only table
      # that grows without bound, so cap it rather than size the PVC for a
      # year of traffic. Takes effect once litellm has a database — it is
      # inert while running config-only. Keep the "<n>d" string form: an
      # unparseable value is logged as a warning and silently disables the
      # cleanup job rather than failing.
      maximum_spend_logs_retention_period: "30d"

    litellm_settings:
      drop_params: true
