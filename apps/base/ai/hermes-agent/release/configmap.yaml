# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: &app hermes-agent
data:
  config.yaml: |
    # Model names are litellm's `model_name` values, not the upstream provider's
    # — litellm exposes MiniMax as a bare `MiniMax-M3`, so the old
    # `minimax/MiniMax-M3` would 400 as an unknown model here.
    model: litellm/MiniMax-M3
    providers:
      # The upstream MiniMax key now lives only in the litellm secret; this app
      # holds a litellm virtual key so its spend is attributable in litellm's
      # own logs. litellm deliberately exposes no model that routes back here,
      # which is what keeps this from being able to loop.
      litellm:
        api_key: ${LITELLM_API_KEY}
        base_url: http://litellm.litellm:4000/v1
      local:
        base_url: ${OLLAMA_URL}
    terminal:
      backend: local
      timeout: 180
    tools:
      enabled:
        - bash
        - read
        - edit
        - glob
        - web_search
        - browser
    memory:
      auto_migrate: true
      auto_summarize:
        threshold: 50
    compression:
      enabled: true
    gateway:
      port: 8642
    # Discord-specific settings
    discord:
      require_mention: true           # Require @mention in server channels
      free_response_channels: ""      # Comma-separated channel IDs (or YAML list)
      auto_thread: true               # Auto-create threads on @mention
      reactions: true                 # Add emoji reactions during processing
      ignored_channels: []            # Channel IDs where bot never responds
      no_thread_channels: []          # Channel IDs where bot responds without threading
      channel_prompts: {}             # Per-channel ephemeral system prompts
      allow_mentions:                 # What the bot is allowed to ping (safe defaults)
        everyone: false               # @everyone / @here pings (default: false)
        roles: false                  # @role pings (default: false)
        users: true                   # @user pings (default: true)
        replied_user: true            # reply-reference pings the author (default: true)

    # Slack-specific settings
    slack:
      require_mention: true           # Require @mention in channels
      free_response_channels: ""      # Comma-separated channel IDs (or YAML list)
      auto_thread: true               # Auto-create threads on @mention
      reactions: true                 # Add emoji reactions during processing
      ignored_channels: []            # Channel IDs where bot never responds
      no_thread_channels: []          # Channel IDs where bot responds without threading
      channel_prompts: {}             # Per-channel ephemeral system prompts
      allow_mentions:                 # What the bot is allowed to ping (safe defaults)
        everyone: false               # @everyone / @here pings (default: false)
        roles: false                  # @role pings (default: false)
        users: true                   # @user pings (default: true)
        replied_user: true            # reply-reference pings the author (default: true)

    # Session isolation (applies to all gateway platforms, not just Discord)
    group_sessions_per_user: true     # Isolate sessions per user in shared channels
