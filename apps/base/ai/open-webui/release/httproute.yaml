# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - open-webui.j6n.internal
  rules:
  - backendRefs:
    - name: open-webui
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-external
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
  hostnames:
  - chat.j6n.dev
  rules:
  - backendRefs:
    - name: open-webui
      port: 8080
