# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # OAUTH CONFIG
        ENABLE_SIGNUP: "false"
        ENABLE_LOGIN_FORM: "false"
        ENABLE_OAUTH_SIGNUP: "true"
        ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
        OAUTH_ROLES_CLAIM: groups
        OAUTH_ADMIN_ROLES: open-webui_admin
        OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
        OAUTH_PROVIDER_NAME: Authentik
        OPENID_PROVIDER_URL: https://auth.j6n.dev/application/o/open-webui/.well-known/openid-configuration
        OAUTH_SCOPES: openid email profile
        OPENID_REDIRECT_URI: https://chat.j6n.dev/oauth/oidc/callback
        OAUTH_CLIENT_ID: "{{ .client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
        # Aligned positionally with OPENAI_API_BASE_URLS, which is now a single
        # litellm endpoint — so one key, a litellm virtual key rather than any
        # upstream provider key. Keeping it per-app is what makes open-webui's
        # spend attributable in litellm's own logs.
        OPENAI_API_KEYS: "{{ .litellm_key }}"
  data:
    # Explicit ref rather than a dataFrom extract: an extract renders a missing
    # or renamed field as an empty string, which here would mean an empty key
    # and a 401 from litellm on every model call.
    - secretKey: litellm_key
      remoteRef:
        key: litellm-open-webui
        property: password
  dataFrom:
    - extract:
        key: open-webui-oidc
