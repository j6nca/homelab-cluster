# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app paseo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # Daemon password; hashed at startup. Every client (web UI, phone,
        # CLI) needs it on a direct connection — relay pairing does not.
        PASEO_PASSWORD: "{{ .password }}"
        # Dedicated LiteLLM virtual key for Pi. Codex keeps using its persisted
        # ChatGPT subscription login and does not consume this variable.
        LITELLM_API_KEY: "{{ .litellm_key }}"
  data:
    - secretKey: password
      remoteRef:
        key: paseo
        property: password
    - secretKey: litellm_key
      remoteRef:
        key: litellm-paseo
        property: password
