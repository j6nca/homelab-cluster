# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Paseo
    gethomepage.dev/group: AI
    gethomepage.dev/icon: mdi-robot-outline
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=paseo
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only.
    # /api/health is the only path exempt from the daemon password.
    gatus.home-operations.com/endpoint: |
      group: AI
      url: http://paseo.j6n.internal/api/health
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - paseo.j6n.internal
  rules:
  - backendRefs:
    - name: paseo
      port: 6767
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo-relay-external
  annotations:
    gatus.home-operations.com/enabled: "true"
    # /ws is the only public path, so probe the route with a plain GET; the
    # relay answers a non-upgrade request with 426, which proves the tunnel,
    # route and relay are all up (it returns 503 when at capacity)
    gatus.home-operations.com/endpoint: |
      group: External
      url: https://paseo-relay.j6n.dev/ws
      conditions:
        - "[STATUS] == 426"
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
  hostnames:
  - paseo-relay.j6n.dev
  rules:
  # Only the WebSocket endpoint is public. /metrics and /ready stay
  # cluster-internal; payloads are end-to-end encrypted between the phone and
  # the daemon, so the relay never sees plaintext.
  - matches:
    - path:
        type: PathPrefix
        value: /ws
    backendRefs:
    - name: paseo-relay
      port: 4000
