---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # The secret half of the homeserver config, loaded as a second
        # --config-path after /config/homeserver.yaml. Synapse merges the
        # files shallowly, top-level key by top-level key, so `database` is
        # spelled out in full here rather than split across the two.
        #
        # Database credentials come from the synapse-postgres item, shared
        # with the CNPG cluster's managed role (components/postgres), so the
        # string Synapse dials with and the one the role is created with
        # cannot drift.
        secrets.yaml: |
          database:
            name: psycopg2
            args:
              user: "{{ .username }}"
              password: "{{ .password }}"
              dbname: synapse
              host: synapse-postgres-rw
              port: 5432
              cp_min: 5
              cp_max: 10
          # Authorises register_new_matrix_user; the only way accounts get
          # made while enable_registration is off.
          registration_shared_secret: "{{ .registration_shared_secret }}"
          # Signs access tokens. Rotating it logs every session out.
          macaroon_secret_key: "{{ .macaroon_secret_key }}"
          form_secret: "{{ .form_secret }}"
  data:
    # Explicit refs rather than a dataFrom extract: an extract renders a
    # missing or renamed field as an empty string, and an empty macaroon key
    # makes Synapse generate one per restart rather than fail to start.
    - secretKey: registration_shared_secret
      remoteRef:
        key: *app
        property: registration_shared_secret
    - secretKey: macaroon_secret_key
      remoteRef:
        key: *app
        property: macaroon_secret_key
    - secretKey: form_secret
      remoteRef:
        key: *app
        property: form_secret
    - secretKey: username
      remoteRef:
        key: synapse-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: synapse-postgres
        property: password
