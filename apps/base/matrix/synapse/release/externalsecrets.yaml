---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # The secret half of the homeserver config, loaded as a second
        # --config-path after /config/homeserver.yaml. Synapse merges the
        # files shallowly, top-level key by top-level key, so `database` is
        # spelled out in full here rather than split across the two.
        #
        # Database credentials come from the synapse-postgres item, shared
        # with the CNPG cluster's managed role (components/postgres), so the
        # string Synapse dials with and the one the role is created with
        # cannot drift.
        secrets.yaml: |
          database:
            name: psycopg2
            args:
              user: "{{ .username }}"
              password: "{{ .password }}"
              dbname: synapse
              host: synapse-postgres-rw
              port: 5432
              cp_min: 5
              cp_max: 10
          # Authorises register_new_matrix_user; the only way accounts get
          # made while enable_registration is off.
          registration_shared_secret: "{{ .registration_shared_secret }}"
          # Signs access tokens. Rotating it logs every session out.
          macaroon_secret_key: "{{ .macaroon_secret_key }}"
          form_secret: "{{ .form_secret }}"

          # --- Authentik SSO ---------------------------------------------
          # Lives here rather than in homeserver.yaml only because the client
          # id and secret do, and Synapse merges its config files one
          # top-level key at a time: a split `oidc_providers` would not merge,
          # one half would win.
          #
          # The Authentik provider's redirect URI must be exactly:
          #
          #   https://matrix.j6n.dev/_synapse/client/oidc/callback
          #
          # https because Synapse builds it from public_baseurl, not from the
          # request that came in. The issuer must match what Authentik's
          # discovery document says, trailing slash included.
          #
          # The mapping templates are Jinja for Synapse, but this whole file
          # is first a Go template for External Secrets, and both use double
          # curly braces -- including in comments, which is why this one
          # spells them out. Wrapping the Jinja expression in a quoted Go
          # string is how Go emits it literally; what Synapse receives is
          # user.preferred_username inside plain double braces.
          oidc_providers:
            - idp_id: authentik
              idp_name: Authentik
              issuer: https://auth.j6n.dev/application/o/synapse/
              client_id: "{{ .client_id }}"
              client_secret: "{{ .client_secret }}"
              scopes: [openid, profile, email]
              # Maps an Authentik user onto an existing Matrix account with the
              # same localpart rather than failing, so the account created
              # with register_new_matrix_user before SSO existed is the one
              # Authentik signs into.
              allow_existing_users: true
              # Sign-in only. Anyone Authentik lets through who has no
              # account yet is refused, so the Authentik application binding
              # is not the only thing standing between a user and a new
              # account on this server.
              enable_registration: false
              user_mapping_provider:
                config:
                  localpart_template: '{{ "{{ user.preferred_username }}" }}'
                  display_name_template: '{{ "{{ user.name }}" }}'
                  email_template: '{{ "{{ user.email }}" }}'
  data:
    # Explicit refs rather than a dataFrom extract: an extract renders a
    # missing or renamed field as an empty string, and an empty macaroon key
    # makes Synapse generate one per restart rather than fail to start.
    - secretKey: registration_shared_secret
      remoteRef:
        key: *app
        property: registration_shared_secret
    - secretKey: macaroon_secret_key
      remoteRef:
        key: *app
        property: macaroon_secret_key
    - secretKey: form_secret
      remoteRef:
        key: *app
        property: form_secret
    - secretKey: client_id
      remoteRef:
        key: synapse-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: synapse-oidc
        property: client_secret
    - secretKey: username
      remoteRef:
        key: synapse-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: synapse-postgres
        property: password
