---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app synapse
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  # The postgres component appends cnpg here, so this has to exist for its
  # patch to have somewhere to add to.
  dependsOn: []
  interval: 15m
  values:
    deployments:
      app:
        image:
          registry: ghcr.io
          repository: element-hq/synapse
          tag: v1.161.0
          pullPolicy: IfNotPresent

        # Both halves of the config are mounted files read once at startup,
        # so a change to either only takes effect on restart.
        annotations:
          reloader.stakater.com/auto: "true"

        containerName: *app

        # One, and not negotiable while the data volume is ReadWriteOnce: a
        # second pod would sit unschedulable waiting for a volume the
        # outgoing one still holds. Recreate for the same reason. Synapse
        # also cannot run two main processes against one database.
        replicas: 1
        strategy:
          type: Recreate

        # start.py's `run` mode passes everything after it straight to
        # synapse.app.homeserver. Two config paths: the plaintext ConfigMap
        # and the ExternalSecret-rendered database and signing secrets.
        args:
          - run
          - --config-path
          - /config/homeserver.yaml
          - --config-path
          - /secrets/secrets.yaml

        ports:
          - containerPort: 8008
            name: http
            protocol: TCP
          - containerPort: 9000
            name: metrics
            protocol: TCP

        # A cold start runs database migrations before it listens, and on a
        # version bump those can take a while.
        startupProbe:
          httpGet:
            path: &health /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: *health
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: *health
            port: http
          periodSeconds: 15
          timeoutSeconds: 10

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # Synapse caches aggressively and Python never gives memory back;
            # a personal server idles around half a gigabyte and spikes on
            # initial sync. 2Gi is headroom, not an expectation.
            memory: 2Gi

        podSecurityContext:
          # 991 is the uid the image is built for and the one start.py
          # would gosu to if it were started as root.
          runAsUser: 991
          runAsGroup: 991
          fsGroup: 991
          fsGroupChangePolicy: OnRootMismatch
          runAsNonRoot: true

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          # Synapse writes only to the media store and signing key on /data
          # and its pid file under /tmp; everything else is read-only.
          readOnlyRootFilesystem: true

        volumes:
          - name: config
            configMap:
              name: synapse-config
          - name: secrets
            secret:
              secretName: *app
          - name: data
            persistentVolumeClaim:
              claimName: synapse-data
          - name: tmp
            emptyDir: {}

        volumeMounts:
          - name: config
            mountPath: /config
            readOnly: true
          - name: secrets
            mountPath: /secrets
            readOnly: true
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    configmaps:
      # Rendered as synapse-config, which is what the volume below mounts.
      # The secret half of the config is the ExternalSecret; see there for why
      # the two are not one file.
      config:
        data:
          homeserver.yaml: |
            # Non-secret half of the homeserver config. Synapse is started with two
            # --config-path arguments and shallow-merges them, so anything containing a
            # secret -- the whole `database` block, the signing secrets -- lives in
            # secrets.yaml rendered by the ExternalSecret, and must not be repeated here
            # or one file silently overrides the other.

            # The domain in every user ID (@jonathan:matrix.j6n.dev) and room ID. This
            # cannot be changed later without wiping the database and re-creating every
            # account. Deliberately the API hostname rather than the bare domain: the
            # names say which service they belong to, and with server_name equal to the
            # URL clients need no .well-known lookup on the apex to find the server.
            server_name: matrix.j6n.dev
            # Where clients actually reach the API. Baked into media URLs and login
            # responses, hence https and the public hostname, not the internal one.
            public_baseurl: https://matrix.j6n.dev/

            pid_file: /tmp/homeserver.pid

            listeners:
              - port: 8008
                type: http
                tls: false
                # Both routes sit behind Envoy (and Cloudflare externally); without this
                # every client would rate-limit as one IP.
                x_forwarded: true
                bind_addresses: ["0.0.0.0"]
                resources:
                  # `client` only. No `federation` resource means no server-to-server
                  # API is served at all; see federation_domain_whitelist below for the
                  # outbound half.
                  - names: [client]
                    compress: false
              - port: 9000
                type: metrics
                bind_addresses: ["0.0.0.0"]

            # Federation is off in both directions. This server exists for one person
            # and their agent; an empty whitelist is the documented way to deny every
            # remote server, and it also stops Synapse dialling matrix.org for keys.
            federation_domain_whitelist: []
            trusted_key_servers: []
            suppress_key_server_warning: true

            media_store_path: /data/media_store
            # Generated on first start if absent and then kept on the PVC. Losing it
            # only matters for federation, which is off, but it still has to persist or
            # every restart would mint a new server key.
            signing_key_path: /data/signing.key
            # Cloudflare's free tier caps request bodies at 100M; keep under it so an
            # upload that Synapse would accept is not cut off by the edge instead.
            max_upload_size: 50M

            log_config: /config/log.yaml

            # Accounts are created out of band with register_new_matrix_user against the
            # shared secret (see the PR description); nobody signs up through the API.
            enable_registration: false

            # The defaults (0.2 msg/s, burst 10) are tuned for humans on matrix.org. An
            # agent that reacts while it works, edits its reply as it streams, and posts
            # tool output in several messages trips them within a single answer.
            rc_message:
              per_second: 5
              burst_count: 100

            # Two users, both of whom know when the other is around. Presence is a
            # constant trickle of writes for no information.
            presence:
              enabled: false

            report_stats: false
            enable_metrics: true
          log.yaml: |
            # Stdout only. Victoria Logs collects container output, so a file handler
            # would just duplicate it onto the PVC.
            version: 1
            formatters:
              precise:
                format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
            handlers:
              console:
                class: logging.StreamHandler
                formatter: precise
            loggers:
              # SQL statement logging at INFO is a firehose; keep it at WARNING.
              synapse.storage.SQL:
                level: WARNING
            root:
              level: INFO
              handlers: [console]
            disable_existing_loggers: false

    persistentVolumeClaims:
      # Rendered as synapse-data. Uploaded media plus the signing key;
      # everything else is in postgres. Media is whatever gets pasted into a
      # chat with the agent -- screenshots and the odd file -- so this is
      # generous rather than tight. Sized up front because Longhorn can't
      # expand it while the pool is two nodes against a three-replica class.
      data:
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        annotations:
          # Helm deletes the PVCs it owns on uninstall. This one holds the
          # server's signing key and every uploaded file, so it outlives the
          # release: a recreated or renamed HelmRelease reattaches to it.
          helm.sh/resource-policy: keep

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8008
            targetPort: http
            protocol: TCP
            name: http
          - port: 9000
            targetPort: metrics
            protocol: TCP
            name: metrics
