---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/core/persistentvolumeclaim_v1.json
# Declared here rather than by the chart: generic mounts volumes but does not
# provision them, so the claim is an ordinary manifest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Uploaded media plus the signing key. Everything else is in postgres.
      # Media is whatever gets pasted into a chat with the agent -- screenshots
      # and the odd file -- so this is generous rather than tight. Sized up
      # front because Longhorn can't expand it while the pool is two nodes
      # against a three-replica class.
      storage: 10Gi
