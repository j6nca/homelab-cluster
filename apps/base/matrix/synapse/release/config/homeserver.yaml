# Non-secret half of the homeserver config. Synapse is started with two
# --config-path arguments and shallow-merges them, so anything containing a
# secret -- the whole `database` block, the signing secrets -- lives in
# secrets.yaml rendered by the ExternalSecret, and must not be repeated here
# or one file silently overrides the other.

# The domain in every user ID (@jonathan:matrix.j6n.dev) and room ID. This
# cannot be changed later without wiping the database and re-creating every
# account. Deliberately the API hostname rather than the bare domain: the
# names say which service they belong to, and with server_name equal to the
# URL clients need no .well-known lookup on the apex to find the server.
server_name: matrix.j6n.dev
# Where clients actually reach the API. Baked into media URLs and login
# responses, hence https and the public hostname, not the internal one.
public_baseurl: https://matrix.j6n.dev/

pid_file: /tmp/homeserver.pid

listeners:
  - port: 8008
    type: http
    tls: false
    # Both routes sit behind Envoy (and Cloudflare externally); without this
    # every client would rate-limit as one IP.
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      # `client` only. No `federation` resource means no server-to-server
      # API is served at all; see federation_domain_whitelist below for the
      # outbound half.
      - names: [client]
        compress: false
  - port: 9000
    type: metrics
    bind_addresses: ["0.0.0.0"]

# Federation is off in both directions. This server exists for one person
# and their agent; an empty whitelist is the documented way to deny every
# remote server, and it also stops Synapse dialling matrix.org for keys.
federation_domain_whitelist: []
trusted_key_servers: []
suppress_key_server_warning: true

media_store_path: /data/media_store
# Generated on first start if absent and then kept on the PVC. Losing it
# only matters for federation, which is off, but it still has to persist or
# every restart would mint a new server key.
signing_key_path: /data/signing.key
# Cloudflare's free tier caps request bodies at 100M; keep under it so an
# upload that Synapse would accept is not cut off by the edge instead.
max_upload_size: 50M

log_config: /config/log.yaml

# Accounts are created out of band with register_new_matrix_user against the
# shared secret (see the PR description); nobody signs up through the API.
enable_registration: false

# The defaults (0.2 msg/s, burst 10) are tuned for humans on matrix.org. An
# agent that reacts while it works, edits its reply as it streams, and posts
# tool output in several messages trips them within a single answer.
rc_message:
  per_second: 5
  burst_count: 100

# Two users, both of whom know when the other is around. Presence is a
# constant trickle of writes for no information.
presence:
  enabled: false

report_stats: false
enable_metrics: true
