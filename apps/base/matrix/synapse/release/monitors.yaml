---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: synapse
spec:
  endpoints:
    - port: metrics
      # Synapse's metrics listener serves /_synapse/metrics, not /metrics.
      path: /_synapse/metrics
      interval: 1m
      scrapeTimeout: 30s
  selector:
    matchLabels:
      app.kubernetes.io/instance: synapse
      app.kubernetes.io/name: synapse-app
