# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      version: 1.4.4
  interval: 15m
  values:
    image:
      # Override version here as latest chart is not yet caught up
      tag: v5.34.0
      # pinned by digest (chart renders repository:tag@sha256:<sha>)
      sha: 3fff895e77d35ee62e898860f4613755bc2344127d93e3f326429d40270e2115
    service:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics-path: "/metrics"
        k8s.grafana.com/portName: "http"
        k8s.grafana.com/metrics-scheme: "http"
    persistence:
      enabled: false
    serviceMonitor:
      enabled: false
    env:
      # a directory: gatus merges every yaml inside — the static config
      # below (overlaid as config.yaml) plus the sidecar's generated file
      GATUS_CONFIG_PATH: /dynamic-config
    sidecarContainers:
      gatus-sidecar:
        image: ghcr.io/home-operations/gatus-sidecar:0.4.0@sha256:4a4bf52c7b8c292f08b0bd42cf93a6deaccfdf43531a0f082bb9504774c914de
        args:
          # annotation-gated: only Services/HTTPRoutes carrying
          # gatus.home-operations.com/enabled: "true" get endpoints;
          # gatus.home-operations.com/endpoint can override the defaults
          - --enable-service
          - --enable-httproute
          - --output=/dynamic-config/gatus-sidecar.yaml
        volumeMounts:
          - name: gatus-dynamic-config
            mountPath: /dynamic-config
    serviceAccount:
      # the sidecar's ClusterRoleBinding targets the "gatus" SA — without
      # create, the pod runs as "default" and the sidecar has no RBAC
      create: true
      autoMount: true
    extraVolumeMounts:
      - name: gatus-dynamic-config
        mountPath: /dynamic-config
        readOnly: false
      # the chart's own configmap, overlaid into the merged config dir
      - name: gatus-static-config
        existingConfigMap: gatus
        mountPath: /dynamic-config/config.yaml
        subPath: config.yaml
        readOnly: true
    config:
      storage:
        type: memory
      ui:
        dark-mode: true
        default-sort-by: group
        logo: https://res.cloudinary.com/drwjkxxud/image/upload/v1769112783/150px-Sticky_Piston__U__JE3_i4agw4.webp
        link: https://status.j6n.dev
        buttons:
          - name: Github
            link: https://github.com/j6nca
          - name: Kubernetes
            link: https://meow.j6n.dev

      metrics: true
      connectivity:
        checker:
          target: 1.1.1.1:53
          interval: 300s
      endpoints:
        - name: Cloudflare
          group: Connectivity
          url: icmp://1.1.1.1
          interval: 5m
          conditions:
            - "[CONNECTED] == true"

        - name: Google
          group: Connectivity
          url: icmp://8.8.8.8
          interval: 5m
          conditions:
            - "[CONNECTED] == true"

        - name: Quad9
          group: Connectivity
          url: icmp://9.9.9.9
          interval: 5m
          conditions:
            - "[CONNECTED] == true"
        - name: j6n.dev
          group: Domains
          url: https://j6n.dev
          interval: 24h
          conditions:
            - "[DOMAIN_EXPIRATION] >= 7d"
        - name: j6n.ca
          group: Domains
          url: https://j6n.ca
          interval: 24h
          conditions:
            - "[DOMAIN_EXPIRATION] >= 7d"

        # Frontier AI providers litellm/hermes depend on. Two checks each:
        # "API" proves the endpoint is reachable from the cluster (no key is
        # sent, so a healthy API answers 401 with its own error body), and
        # "Status" mirrors what the provider itself reports (indicator is
        # none/minor/major/critical; anything but none is an open incident).
        - name: OpenAI API
          group: AI Providers
          url: https://api.openai.com/v1/models
          interval: 5m
          conditions:
            - "[STATUS] == 401"
            - "[BODY].error.type == invalid_request_error"
        - name: OpenAI Status
          group: AI Providers
          url: https://status.openai.com/api/v2/status.json
          interval: 5m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].status.indicator == none"
        - name: Anthropic API
          group: AI Providers
          url: https://api.anthropic.com/v1/models
          interval: 5m
          conditions:
            - "[STATUS] == 401"
            - "[BODY].error.type == authentication_error"
        - name: Anthropic Status
          group: AI Providers
          # status.anthropic.com 301s here
          url: https://status.claude.com/api/v2/status.json
          interval: 5m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].status.indicator == none"
