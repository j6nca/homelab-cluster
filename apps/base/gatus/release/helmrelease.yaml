# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      version: 1.4.4
  interval: 15m
  values:
    image:
      # Override version here as latest chart is not yet caught up
      tag: v5.34.0
    service:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics-path: "/metrics"
        k8s.grafana.com/portName: "http"
        k8s.grafana.com/metrics-scheme: "http"
    persistence:
      enabled: false
    serviceMonitor:
      enabled: false
    env:
      # a directory: gatus merges every yaml inside — the static config
      # below (overlaid as config.yaml) plus the sidecar's generated file
      GATUS_CONFIG_PATH: /dynamic-config
    sidecarContainers:
      gatus-sidecar:
        image: ghcr.io/home-operations/gatus-sidecar:0.4.0
        args:
          # annotation-gated: only Services/HTTPRoutes carrying
          # gatus.home-operations.com/enabled: "true" get endpoints;
          # gatus.home-operations.com/endpoint can override the defaults
          - --enable-service
          - --enable-httproute
          - --output=/dynamic-config/gatus-sidecar.yaml
        volumeMounts:
          - name: gatus-dynamic-config
            mountPath: /dynamic-config
    serviceAccount:
      # the sidecar's ClusterRoleBinding targets the "gatus" SA — without
      # create, the pod runs as "default" and the sidecar has no RBAC
      create: true
      autoMount: true
    extraVolumeMounts:
      - name: gatus-dynamic-config
        mountPath: /dynamic-config
        readOnly: false
      # the chart's own configmap, overlaid into the merged config dir
      - name: gatus-static-config
        existingConfigMap: gatus
        mountPath: /dynamic-config/config.yaml
        subPath: config.yaml
        readOnly: true
    config:
      storage:
        type: memory
      ui:
        dark-mode: true
        default-sort-by: group
        logo: https://res.cloudinary.com/drwjkxxud/image/upload/v1769112783/150px-Sticky_Piston__U__JE3_i4agw4.webp
        link: https://status.j6n.dev
        buttons:
          - name: Github
            link: https://github.com/j6nca
          - name: Kubernetes
            link: https://meow.j6n.dev

      metrics: true
      connectivity:
        checker:
          target: 1.1.1.1:53
          interval: 300s
      endpoints:
        - name: Cloudflare
          group: Connectivity
          url: icmp://1.1.1.1
          interval: 5m
          conditions:
            - "[CONNECTED] == true"

        - name: Google
          group: Connectivity
          url: icmp://8.8.8.8
          interval: 5m
          conditions:
            - "[CONNECTED] == true"

        - name: Quad9
          group: Connectivity
          url: icmp://9.9.9.9
          interval: 5m
          conditions:
            - "[CONNECTED] == true"
        - name: j6n.dev
          group: Domains
          url: https://j6n.dev
          interval: 24h
          conditions:
            - "[DOMAIN_EXPIRATION] >= 7d"
        - name: j6n.ca
          group: Domains
          url: https://j6n.ca
          interval: 24h
          conditions:
            - "[DOMAIN_EXPIRATION] >= 7d"
