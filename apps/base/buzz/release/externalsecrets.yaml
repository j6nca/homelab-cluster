---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # the role name is fixed by components/postgres (managed role
        # ${APP}), so only the password is looked up — a bare {{ .username }}
        # here silently rendered empty and the relay fell back to
        # connecting as "anonymous"
        DATABASE_URL: "postgres://buzz:{{ .pg_password }}@buzz-postgres-rw:5432/buzz"
        # dragonfly runs unauthenticated inside the namespace
        REDIS_URL: "redis://buzz-dragonfly:6379"
        # 64-char hex relay identity; rotation = identity change
        BUZZ_RELAY_PRIVATE_KEY: "{{ .relay_private_key }}"
        # buzz identity, scoped to buzz-media in the seaweedfs-s3-config
        # identities file
        BUZZ_S3_ACCESS_KEY: "{{ .s3_access_key }}"
        BUZZ_S3_SECRET_KEY: "{{ .s3_secret_key }}"
  # explicit per-property refs, not dataFrom/extract: several 1Password
  # items carry generic username/password fields, so merged extracts can
  # clobber each other, and a missing key renders as empty string instead
  # of failing the sync
  data:
    - secretKey: pg_password
      remoteRef:
        key: buzz-postgres
        property: password
    - secretKey: relay_private_key
      remoteRef:
        key: buzz
        property: relay_private_key
    - secretKey: s3_access_key
      remoteRef:
        key: seaweedfs
        property: buzz_access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: seaweedfs
        property: buzz_secret_key
