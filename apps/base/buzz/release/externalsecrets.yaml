---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # password comes from the buzz-postgres item, shared with the
        # CNPG cluster's managed role (components/postgres externalsecret)
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@buzz-postgres-rw:5432/buzz"
        # dragonfly runs unauthenticated inside the namespace
        REDIS_URL: "redis://buzz-dragonfly:6379"
        # 64-char hex relay identity; rotation = identity change
        BUZZ_RELAY_PRIVATE_KEY: "{{ .relay_private_key }}"
        # TODO(s3): add BUZZ_S3_ACCESS_KEY / BUZZ_S3_SECRET_KEY once the
        # garage/rustfs decision lands and the object store is deployed
  dataFrom:
    - extract:
        key: buzz
    - extract:
        key: buzz-postgres
