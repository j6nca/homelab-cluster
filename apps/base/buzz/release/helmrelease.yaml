# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buzz
spec:
  chartRef:
    kind: OCIRepository
    name: buzz
    namespace: flux-system
  interval: 15m
  # cnpg + dragonfly-operator entries are appended by the component patches
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  # ownerPubkey comes from the buzz-nostr 1Password item via ExternalSecret.
  # It must NOT also appear under spec.values — inline values take
  # precedence over valuesFrom, so an empty inline value would win and the
  # chart would refuse to render.
  valuesFrom:
    - kind: Secret
      name: buzz-nostr
      valuesKey: public_key
      targetPath: ownerPubkey
  values:
    relayUrl: wss://buzz.j6n.dev

    # keys: DATABASE_URL, REDIS_URL, BUZZ_RELAY_PRIVATE_KEY (+ S3 creds
    # later) — composed by the buzz-secrets ExternalSecret
    secrets:
      existingSecret: buzz-secrets

    replicaCount: 1

    # ephemeral git working space; sources of truth are S3 + postgres
    persistence:
      git:
        enabled: true
        storageClass: longhorn
        size: 5Gi

    relay:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    # in-cluster SeaweedFS (allInOne); the bucket is created by the
    # seaweedfs chart's hook, credentials come via buzz-secrets. The
    # relay's startup conformance probe validates the gateway's
    # conditional-write (CAS) semantics on every boot.
    s3:
      endpoint: http://seaweedfs-all-in-one.seaweedfs.svc:8333
      bucket: buzz-media
      addressingStyle: path

    # exposure is handled by the HTTPRoutes in this directory, not the chart
    ingress:
      enabled: false
    httproute:
      enabled: false
