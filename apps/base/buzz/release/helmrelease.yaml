# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buzz
spec:
  chartRef:
    kind: OCIRepository
    name: buzz
    namespace: flux-system
  interval: 15m
  # cnpg + dragonfly-operator entries are appended by the component patches
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  values:
    image:
      # the chart defaults to its appVersion (0.1.0), an image built
      # 2026-06-14 — two days before automatic migrations landed upstream,
      # so it ignores BUZZ_AUTO_MIGRATE and starts against an empty schema.
      # 0.2.0 is the newest released tag (same digest as latest).
      tag: 0.2.0

    relayUrl: wss://buzz.j6n.dev

    # jonathan's Nostr pubkey (public by design — the private half lives
    # in 1Password as buzz-nostr). Inline rather than valuesFrom so CI can
    # render the chart, whose schema requires this to be set.
    ownerPubkey: 73993a820faaf8f79efe73246daf2f2b9bb2a226bc32cdc37f1864f853d4aa9b

    # keys: DATABASE_URL, REDIS_URL, BUZZ_RELAY_PRIVATE_KEY (+ S3 creds
    # later) — composed by the buzz-secrets ExternalSecret
    secrets:
      existingSecret: buzz-secrets

    replicaCount: 1

    # Pure scratch: refs and objects rehydrate from object storage per
    # request and repo names live in postgres, so this holds no source of
    # truth. Kept off longhorn deliberately — a 5Gi PVC cost ~15Gi of pool
    # (the longhorn storageclass provisions 3 replicas), which is a poor
    # trade for a volume whose only loss is a cold rehydrate after a
    # restart. size is now an emptyDir sizeLimit on node ephemeral storage,
    # a cap rather than a reservation; raise it if pack operations get
    # evicted for exceeding it.
    persistence:
      git:
        enabled: false
        size: 2Gi

    # The pack cache is a second per-pod emptyDir on the same node disk that
    # longhorn draws from, and the chart's 7Gi/5GiB defaults would let this
    # pod grow to ~9Gi of node storage once warm. Trimmed to fit a small
    # disk, keeping the cap above worst-case use: 1GiB of cache plus one
    # cold population staging a maxPackBytes (500MiB) pack = 1.5GiB against
    # a 2Gi ceiling. Concurrency is 1 so staging can't double that —
    # serialising cold populations costs first-access latency, not
    # correctness.
    git:
      packCacheVolumeSize: 2Gi
      packCacheMaxBytes: 1073741824
      packCacheMaxConcurrentPopulations: 1

    relay:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    # in-cluster SeaweedFS (allInOne); the bucket is created by the
    # seaweedfs chart's hook, credentials come via buzz-secrets. The
    # relay's startup conformance probe validates the gateway's
    # conditional-write (CAS) semantics on every boot.
    # chart 0.1.7 has no addressingStyle knob; the relay defaults to
    # path-style, which is what SeaweedFS expects
    s3:
      endpoint: http://seaweedfs-all-in-one.seaweedfs.svc:8333
      bucket: buzz-media

    # exposure is handled by the HTTPRoutes in this directory, not the chart
    ingress:
      enabled: false
    httproute:
      enabled: false
