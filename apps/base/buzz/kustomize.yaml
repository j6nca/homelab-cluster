---
# NOT DEPLOYED. clusters/homelab/apps/buzz was removed to reclaim longhorn
# pool: buzz-postgres at 3Gi and seaweedfs at 1Gi cost ~12Gi between them once
# the storageclass's 3 replicas are counted. Kept here so re-enabling is a
# matter of restoring that directory, the buzz entry under
# clusters/homelab/repos/oci, and seaweedfs alongside it.
#
# Nothing was backed up before the prune — buzz had no volsync
# ReplicationSource — so the relay database and the buzz-media bucket are
# gone. A redeploy is a fresh install, not a restore, and would want a
# ReplicationSource of its own before it holds anything worth keeping.
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app buzz
  namespace: flux-system
spec:
  components:
    - ../../../../components/postgres
    - ../../../../components/dragonfly
  postBuild:
    substitute:
      APP: *app
      POSTGRES_REPLICAS: "1"
      POSTGRES_SIZE: 3Gi
      DRAGONFLY_REPLICAS: "1"
      DRAGONFLY_MAX_MEMORY: 512Mi
  targetNamespace: *app
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/buzz/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buzz-monitoring
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      service: buzz
  dependsOn:
    - name: victoria-metrics
  interval: 5m
  path: ./apps/base/buzz/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
