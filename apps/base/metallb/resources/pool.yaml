# top of the 10.1.8.0/24 homelab subnet; the UDM Pro's DHCP scope for this
# network must stop at 10.1.8.239 so leases never collide with the pool
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
spec:
  addresses:
    - 10.1.8.240-10.1.8.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
spec:
  ipAddressPools:
    - lan
