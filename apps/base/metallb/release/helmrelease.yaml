# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app metallb
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: *app
        namespace: flux-system
      version: 0.16.1
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  interval: 15m
  values:
    # k-worker-ai-1 carries ai=true:NoSchedule. Both the speaker and the
    # frr-k8s backend run as DaemonSets across every node, so they need the
    # toleration to keep announcing services from that node.
    speaker:
      tolerations:
        - key: ai
          operator: Equal
          value: "true"
          effect: NoSchedule
    frr-k8s:
      frrk8s:
        tolerations:
          - key: ai
            operator: Equal
            value: "true"
            effect: NoSchedule
