# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      group: Observability
      url: http://grafana.j6n.internal
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
  hostnames:
  - grafana.j6n.internal
  rules:
  - backendRefs:
    - name: grafana-service
      port: 80
