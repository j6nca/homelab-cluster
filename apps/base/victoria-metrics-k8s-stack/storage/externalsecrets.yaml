# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmks-0-replication
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # Now in-cluster garage rather than R2. vmstorage is the noisy volume
        # here — a month of samples rewritten nightly — so it is the one whose
        # egress and object count are worth keeping off a metered bucket.
        # Metrics are also the most replaceable thing backed up: losing them
        # costs history, not state, which makes this the right first tenant
        # for a store that has not yet proven itself.
        #
        # Path-style against the service, so no DNS or gateway is in the
        # backup path. The old R2 repository is left untouched and stops
        # receiving snapshots — reverting this template restores it with its
        # history intact.
        RESTIC_REPOSITORY: s3:http://garage.garage.svc:3900/volsync/vmks-0
        RESTIC_PASSWORD: "{{ .restic_password | toString }}"
        AWS_ACCESS_KEY_ID: "{{ .access_key_id | toString }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key | toString }}"
        # Must match s3_region in garage's config; restic signs with it and
        # garage rejects a mismatch.
        AWS_DEFAULT_REGION: garage

  data:
    # Unchanged, and deliberately still the volsync-r2 item: the restic
    # password is the repository's encryption key, not a property of the
    # bucket it sits in. Reusing it is what keeps the R2 repo readable as a
    # fallback with the same credential.
    - secretKey: restic_password
      remoteRef:
        key: volsync-r2
        property: restic_password
    - secretKey: access_key_id
      remoteRef:
        key: garage-volsync
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: garage-volsync
        property: secret_access_key
