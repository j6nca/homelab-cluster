# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Alertmanager
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: alertmanager.png
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/name=vmalertmanager
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Observability
      url: http://alertmanager.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - alertmanager.j6n.internal
  rules:
  # the vmalertmanager the stack creates for the `vmks` release — the same
  # service karma reads from. Alertmanager has no auth of its own, and
  # silences are a write path, so this stays off envoy-external.
  - backendRefs:
    - name: vmalertmanager-vmks-victoria-metrics-k8s-stack
      port: 9093
