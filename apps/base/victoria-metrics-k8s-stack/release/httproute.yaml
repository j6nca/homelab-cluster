# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Observability
      url: http://alertmanager.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - alertmanager.j6n.internal
  rules:
  # the vmalertmanager the stack creates for the `vmks` release — the same
  # service karma reads from. Alertmanager has no auth of its own, and
  # silences are a write path, so this stays off envoy-external.
  - backendRefs:
    - name: vmalertmanager-vmks-victoria-metrics-k8s-stack
      port: 9093
