# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/externaldns.k8s.io/dnsendpoint_v1alpha1.json
# GitHub Pages custom domains. external-dns owns the record; the repo's Pages
# domain is set by terraform/github-pages/sites.tf, which refuses to apply until
# the dnsName below resolves. Keep the two lists in step.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: github-pages-nebula-md
  # Pages source: thanoslabs/nebula-md
spec:
  endpoints:
    - dnsName: nebula-md.thanoslabs.org
      recordType: CNAME
      targets:
        - thanoslabs.github.io
      providerSpecific:
        # DNS-only: GitHub Pages can't issue its cert behind the proxy
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
---
