# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-dns
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      service: *app
  dependsOn:
    - name: external-secrets-resources
  interval: 5m
  path: ./apps/base/external-dns/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# records with no in-cluster backend (GitHub Pages etc.), declared as
# DNSEndpoints; separate so the CRD exists before they apply
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-records
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      service: external-dns
  dependsOn:
    - name: external-dns
  interval: 5m
  path: ./apps/base/external-dns/records
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
