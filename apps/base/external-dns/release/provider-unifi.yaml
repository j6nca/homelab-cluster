# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-unifi
spec:
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      version: 1.19.0
  install:
    # CRDs are owned by the cloudflare instance's release
    crds: Skip
  upgrade:
    crds: Skip
    cleanupOnFail: true
  interval: 15m
  # values.yaml
  values:
    fullnameOverride: external-dns-unifi
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.9
        env:
          # local record for the UDM Pro
          - name: UNIFI_HOST
            value: http://unifi.internal
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi-api-key
                key: token
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    triggerLoopOnEvent: true
    # exposure declaration: an HTTPRoute attached to a gateway labelled
    # external-dns/internal=true gets a LAN record on the UDM Pro -> envoy-internal
    sources:
      - gateway-httproute
    domainFilters:
      - j6n.internal
    # nothing else manages j6n.internal, so deleted routes clean up records
    policy: sync
    txtOwnerId: homelab
    txtPrefix: k8s.
    extraArgs:
      - --gateway-namespace=network
      - --gateway-label-filter=external-dns/internal=true
