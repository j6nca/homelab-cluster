# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/storage.k8s.io/storageclass_v1.json
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-unas-backup
provisioner: nfs.csi.k8s.io
parameters:
  server: mimir.internal
  # Separate path from nfs-unas-media on purpose: backups and media have
  # opposite handling. This one is never pruned by an app and its reclaim
  # policy differs, so sharing a root with MEDIA would make a media cleanup
  # capable of taking the backups with it.
  #
  # The driver creates one subdirectory per PV beneath this path, so
  # .../volsync ends up holding a directory per volume rather than a pile of
  # loose objects — which is also what keeps garage's blocks from landing
  # directly in a path something else might tidy up.
  share: /var/nfs/shared/KUBERNETES/volsync
# Retain, unlike every other storageclass here. This backs garage's object
# data, which is the restore path for everything else in the cluster —
# deleting the PVC (a bad prune, a renamed release, a fat-fingered namespace
# delete) must not be able to delete the backups along with it. The cost is
# that a genuinely unwanted volume has to be released by hand on the NAS.
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.2
  - nconnect=16
  - hard
  - noatime
