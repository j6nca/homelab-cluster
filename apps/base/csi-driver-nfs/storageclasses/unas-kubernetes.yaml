# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/storage.k8s.io/storageclass_v1.json
---
# General-purpose cluster storage on the UNAS, for anything that wants a
# volume off the longhorn pool.
#
# There is deliberately no per-application class here. A StorageClass models
# a storage *policy* — where it lives, how it is mounted, what happens when
# the claim goes away — not a location, and a class per consumer would mean a
# new manifest every time something wanted a directory. Layout is handled by
# subDir templating instead: every volume lands at
#
#     /var/nfs/shared/KUBERNETES/<namespace>/<pvc-name>
#
# The absolute path, matching the media volumes, because these mounts no
# longer force NFSv4 -- see mountOptions below.
#
# which is self-organising, readable on the NAS, and unique without anyone
# choosing a path. Note that subDir is settable only on the class — a PVC
# cannot pick its own — so this templating is the mechanism that replaces
# per-consumer classes rather than a convenience on top of them.
# Every node needs export access on the NAS, not just the ones running
# workloads. Provisioning and mounting happen in different places: the CSI
# controller creates the subdirectory from whichever node it is scheduled on --
# in practice the control plane, which runs nothing else that touches this --
# and the node plugin then mounts the volume on whichever worker the pod lands.
# A control plane missing from the allow-list fails every claim with
# "access denied by server" while the share looks correctly exported.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-unas
provisioner: nfs.csi.k8s.io
parameters:
  server: mimir.internal
  share: /var/nfs/shared/KUBERNETES
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  # No version pinned, deliberately. The media volumes mount this same server
  # with no version option and have always worked; these classes forced
  # nfsvers=4.2 and never mounted once. Two paths were tried under v4 -- the
  # absolute one and the pseudo-root-relative /KUBERNETES -- and the server
  # answered "No such file or directory" to both, which is what a server with
  # no v4 namespace to resolve against says.
  #
  # Letting the client negotiate is what the working mounts already do, so
  # this stops being a different configuration that has to be reasoned about
  # separately.
  #
  # nconnect went with it: it is a v4-only option, so pinning multiple
  # connections while negotiating down to v3 would be asking for something the
  # protocol cannot give.
  - hard
  - noatime
---
# Same server, same share, same layout — the only thing that differs is what
# happens when the claim is deleted, which is the one axis that actually
# justifies a second class.
#
# For anything whose loss is unrecoverable, principally garage's object data:
# that is the restore path for every other volume in the cluster, so a bad
# prune, a renamed release or a fat-fingered namespace delete must not be
# able to take it. reclaimPolicy keeps the PV, and onDelete keeps the
# directory even if the PV is removed by hand — the two guard different
# halves of the same accident.
#
# One consequence worth knowing: because the path is derived from namespace
# and PVC name rather than a generated ID, recreating a PVC with the same
# name reattaches it to the existing directory. That is intended — a
# redeployed garage should find its blocks rather than silently start empty —
# but it does mean the data outlives the claim, and stale directories have to
# be cleared by hand on the NAS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-unas-retain
provisioner: nfs.csi.k8s.io
parameters:
  server: mimir.internal
  share: /var/nfs/shared/KUBERNETES
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDelete: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  # No version pinned, deliberately. The media volumes mount this same server
  # with no version option and have always worked; these classes forced
  # nfsvers=4.2 and never mounted once. Two paths were tried under v4 -- the
  # absolute one and the pseudo-root-relative /KUBERNETES -- and the server
  # answered "No such file or directory" to both, which is what a server with
  # no v4 namespace to resolve against says.
  #
  # Letting the client negotiate is what the working mounts already do, so
  # this stops being a different configuration that has to be reasoned about
  # separately.
  #
  # nconnect went with it: it is a v4-only option, so pinning multiple
  # connections while negotiating down to v3 would be asking for something the
  # protocol cannot give.
  - hard
  - noatime
