# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app csi-driver-nfs
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/csi-driver-nfs/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app csi-driver-nfs-storageclasses
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      service: *app
  dependsOn:
    - name: csi-driver-nfs
  interval: 5m
  path: ./apps/base/csi-driver-nfs/storageclasses
  prune: true
  # StorageClass parameters are immutable, so renaming the NFS server cannot
  # be patched in place — the apply fails with "updates to parameters are
  # forbidden" and the kustomization stalls until the object is deleted by
  # hand. force lets Flux delete and recreate it instead. Safe here because
  # this path holds nothing but StorageClasses: recreating one does not touch
  # any PV or PVC already provisioned through it.
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
