# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-external
  annotations:
    # group: External inherited from the envoy-external gateway
    gatus.home-operations.com/enabled: "true"
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
  hostnames:
  - auth.j6n.dev
  rules:
  # TLS terminates at cloudflare and the tunnel reaches this gateway over
  # plain http, so envoy stamps x-forwarded-proto: http from the downstream
  # connection. authentik builds absolute URLs from that header and was
  # serving the flow page an api base of http://auth.j6n.dev/ — mixed
  # content the browser refuses to fetch, which surfaces as "The request
  # failed and the interceptors did not return an alternative response".
  # Only correct on the external route; authentik-internal really is http.
  - filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    backendRefs:
    - name: authentik-server
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Authentik
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: authentik.png
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=authentik
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Tools
      url: http://authentik.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - authentik.j6n.internal
  rules:
  - backendRefs:
    - name: authentik-server
      port: 80
