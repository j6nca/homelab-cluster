# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bazarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      bazarr:
        # The config volume is ReadWriteOnce, so the default RollingUpdate
        # deadlocks: the incoming pod waits for a volume the outgoing pod will
        # not release until the incoming pod is ready.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: linuxserver/bazarr
              tag: 1.5.4
            env:
              TZ: America/Toronto
            ports:
              - containerPort: &port 6767
                name: http
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              # Subtitle sync shells out to ffmpeg to decode an audio track,
              # which is the only memory-hungry thing this does.
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        globalMounts:
          - path: /config
            readOnly: false
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
      media:
        type: nfs
        server: mimir.internal
        path: /var/nfs/shared/MEDIA
        # Mounted at the same /data root sonarr and radarr use, so the paths
        # bazarr inherits over their APIs resolve without a path mapping.
        globalMounts:
          - subPath: data
            path: /data
      tmp:
        type: emptyDir
