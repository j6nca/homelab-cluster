# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: *app
        namespace: flux-system
      version: 2.6.0
  interval: 15m
  values:
    # The chart defaults to RollingUpdate, which deadlocks here: config and
    # media are both ReadWriteOnce Longhorn volumes, so the replacement pod
    # cannot attach them while the outgoing pod still holds them, and the
    # outgoing pod is not torn down until the replacement is ready. Recreate
    # accepts a few seconds of downtime instead of hanging indefinitely.
    deploymentStrategy:
      type: Recreate

    persistence:
      # Jellyfin configs
      config:
        enabled: true
        storageClass: longhorn
        # 10Gi, not the chart's default 5Gi. This volume holds far more than
        # configuration: the library database, and a downloaded image for every
        # artist, album, and track, which is what actually grows.
        #
        # The floor is usage plus 2G, not 2G: 10.11 checks for 2G *free* on the
        # data path and refuses to start below it. With roughly 3.3G in use
        # that made 5Gi unviable, which is how this was found — not a
        # degradation, the server simply stopped coming up. 10Gi is about three
        # times current usage; expansion is one-way, so this is sized to be
        # grown again rather than guessed high.
        size: 10Gi
      # Jellyfin metadata (not to be confused with actual media files)
      media:
        enabled: true
        type: pvc
        storageClass: longhorn
        size: 5Gi
    # Here we mount the actual media files via NFS
    volumes:
      - name: data
        nfs:
          server: mimir.internal
          path: /var/nfs/shared/MEDIA

    volumeMounts:
      - mountPath: /data
        name: data
        readOnly: true
        # sub path on NFS
        subPath: data/media
    metrics:
      enabled: true
