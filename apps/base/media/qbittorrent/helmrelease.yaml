# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      qbittorrent:
        # The config volume is ReadWriteOnce, so the default RollingUpdate
        # deadlocks: the incoming pod waits for a volume the outgoing pod will
        # not release until the incoming pod is ready.
        strategy: Recreate
        # TORRENTING_PORT and the whole gluetun env come from gluetun-secret.
        # Without this, an AirVPN forwarded-port rotation updates the Secret
        # but the pod keeps the stale port, so no peer can reach it inbound
        # and torrents stall at 0 seeds until something else restarts it.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: linuxserver/qbittorrent
              tag: 5.1.4
            env:
              TZ: America/Toronto
              WEBUI_PORT: &port 8080
              TORRENTING_PORT:
                valueFrom:
                  secretKeyRef:
                    name: "gluetun-secret"
                    key: FIREWALL_VPN_INPUT_PORTS
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
            probes:
              # Liveness tests egress, readiness tests the WebUI. They are
              # deliberately different questions.
              #
              # The old probe asked only whether / answered on 8080, which it
              # does whether or not the tunnel exists -- so a pod with no
              # connectivity looked perfectly healthy and downloads sat at 0
              # until someone restarted it by hand. The comment here used to
              # claim it caught exactly that; it could not.
              #
              # An IP literal, so a broken DNS resolver inside the tunnel does
              # not read as a dead tunnel. 1.1.1.1/cdn-cgi/trace answers over
              # https and returns the egress address, so a reply proves the
              # request left through the tunnel rather than merely reaching
              # something.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - wget -qO- -T5 https://1.1.1.1/cdn-cgi/trace >/dev/null
                  initialDelaySeconds: 60
                  # Five minutes of failure before a restart. gluetun rebuilds
                  # a dropped tunnel on its own and that takes tens of seconds
                  # -- restarting into the middle of it would interrupt
                  # downloads that were about to recover anyway.
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
              # Still the WebUI, and on purpose: readiness failing removes the
              # pod from the Service, which takes away the interface you would
              # use to see what is wrong. Losing egress should restart the pod,
              # not hide it.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
            resources:
              # Was unset, which made the pod BestEffort and the first thing
              # evicted under node pressure -- and with strategy: Recreate on
              # an RWO Longhorn volume, each eviction is a full outage rather
              # than a rolling one.
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        initContainers:
          vpn:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.40.3
            envFrom:
              - secretRef:
                  name: gluetun-secret
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
                # privileged: true
            # Keep gluetun running for the duration of the pod
            restartPolicy: Always
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          ping:
            image:
              repository: busybox
              tag: latest
            command:
              - sh
              - -c
              - |
                while ! ping -c 1 8.8.8.8; do
                echo "Ping failed, retrying in 5"
                sleep 5
                done
                echo "ping succesfull, exiting"

    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 1000
    #     runAsGroup: 100
    #     fsGroup: 100
    #     fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        globalMounts:
          - path: /config
            readOnly: false
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 500Mi
        accessMode: ReadWriteOnce
      media:
        type: nfs
        server: mimir.internal
        path: /var/nfs/shared/MEDIA
        globalMounts:
          - subPath: data/torrents
            path: /data/torrents
      gluetun:
        type: emptyDir
      tmp:
        type: emptyDir
