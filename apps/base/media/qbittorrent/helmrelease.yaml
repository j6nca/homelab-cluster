# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      qbittorrent:
        # The config volume is ReadWriteOnce, so the default RollingUpdate
        # deadlocks: the incoming pod waits for a volume the outgoing pod will
        # not release until the incoming pod is ready.
        strategy: Recreate
        # TORRENTING_PORT and the whole gluetun env come from gluetun-secret.
        # Without this, an AirVPN forwarded-port rotation updates the Secret
        # but the pod keeps the stale port, so no peer can reach it inbound
        # and torrents stall at 0 seeds until something else restarts it.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: linuxserver/qbittorrent
              tag: 5.1.4
            env:
              TZ: America/Toronto
              WEBUI_PORT: &port 8080
              TORRENTING_PORT:
                valueFrom:
                  secretKeyRef:
                    name: "gluetun-secret"
                    key: FIREWALL_VPN_INPUT_PORTS
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
            probes:
              # The WebUI answers on / once the session is up. Restarting on
              # failure is the point: if gluetun rebuilds the tunnel under it,
              # qbittorrent keeps its old listen socket bound to the dead
              # interface and never re-announces to trackers.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
            resources:
              # Was unset, which made the pod BestEffort and the first thing
              # evicted under node pressure -- and with strategy: Recreate on
              # an RWO Longhorn volume, each eviction is a full outage rather
              # than a rolling one.
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        initContainers:
          vpn:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.40.3
            envFrom:
              - secretRef:
                  name: gluetun-secret
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
                # privileged: true
            # Keep gluetun running for the duration of the pod
            restartPolicy: Always
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          ping:
            image:
              repository: busybox
              tag: latest
            command:
              - sh
              - -c
              - |
                while ! ping -c 1 8.8.8.8; do
                echo "Ping failed, retrying in 5"
                sleep 5
                done
                echo "ping succesfull, exiting"

    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 1000
    #     runAsGroup: 100
    #     fsGroup: 100
    #     fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        globalMounts:
          - path: /config
            readOnly: false
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 500Mi
        accessMode: ReadWriteOnce
      media:
        type: nfs
        server: mimir.internal
        path: /var/nfs/shared/MEDIA
        globalMounts:
          - subPath: data/torrents
            path: /data/torrents
      gluetun:
        type: emptyDir
      tmp:
        type: emptyDir
