# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn: []
  interval: 15m
  values:
    controllers:
      lidarr:
        # The config volume is ReadWriteOnce, so the default RollingUpdate
        # deadlocks: the incoming pod waits for a volume the outgoing pod will
        # not release until the incoming pod is ready.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: linuxserver/lidarr
              tag: 3.1.0
            env:
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__APP__THEME: dark
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__LOG__DBENABLED: "False"
              LIDARR__LOG__LEVEL: info
              LIDARR__POSTGRES__HOST: "media-postgres-rw"
              LIDARR__POSTGRES__MAINDB: "{{ .Release.Name }}"
              LIDARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: password
              LIDARR__POSTGRES__PORT: "5432"
              LIDARR__POSTGRES__USER: "{{ .Release.Name }}"
              LIDARR__SERVER__PORT: &port 8686
              TZ: America/Toronto
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            ports:
              - containerPort: *port
                name: http
                protocol: TCP

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        globalMounts:
          - path: /config
            readOnly: false
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 500Mi
        accessMode: ReadWriteOnce
      media:
        type: nfs
        server: mimir.internal
        path: /var/nfs/shared/MEDIA
        # Needs access to both downloads and media, same /data root sonarr and
        # radarr use so the paths handed to qbittorrent resolve identically.
        globalMounts:
          - subPath: data
            path: /data
      tmp:
        type: emptyDir
