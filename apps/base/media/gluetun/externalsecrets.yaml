# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        VPN_SERVICE_PROVIDER: airvpn
        VPN_TYPE: wireguard
        # Mandatory, airvpn forwarded port
        FIREWALL_VPN_INPUT_PORTS: "{{ .firewall_vpn_input_ports }}"
        # Without this gluetun's firewall DROPs everything that is not the
        # tunnel, including replies to in-cluster callers. gluetun auto-allows
        # only the pod's own /24, so sonarr -> qbittorrent worked when both
        # landed on the same node and silently failed when they did not --
        # which is what made downloads look like they came in short windows.
        # Pod + service CIDRs are the Talos defaults; confirm with
        #   kubectl cluster-info dump | grep -m2 -E 'cluster-cidr|service-cluster-ip-range'
        # Torrent traffic is unaffected: the routing table still sends it out
        # tun0, this only stops the firewall from eating cluster replies.
        FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12
        # gluetun restarts the tunnel when this target is unreachable. The
        # default 1s timeout is tight enough that a slow wireguard handshake
        # reads as unhealthy, so the tunnel gets torn down and rebuilt in a
        # loop. The wait values back the retry off instead of hammering.
        HEALTH_TARGET_ADDRESS: cloudflare.com:443
        HEALTH_VPN_DURATION_INITIAL: 30s
        HEALTH_VPN_DURATION_ADDITION: 10s
        WIREGUARD_PUBLIC_KEY: "{{ .wireguard_public_key }}"
        WIREGUARD_PRIVATE_KEY: "{{ .wireguard_private_key }}"
        WIREGUARD_PRESHARED_KEY: "{{ .wireguard_preshared_key }}"
        WIREGUARD_ADDRESSES: "{{ .wireguard_addresses }}"
        WIREGUARD_ENDPOINT_PORT: "{{ .wireguard_endpoint_port }}"
        SERVER_COUNTRIES: Canada
        UPDATER_PERIOD: 24h
        TZ: America/Toronto

  data:
  - secretKey: firewall_vpn_input_ports
    remoteRef:
      key: &secret gluetun-secret-2
      property: firewall_vpn_input_ports
  - secretKey: wireguard_public_key
    remoteRef:
      key: *secret
      property: wireguard_public_key
  - secretKey: wireguard_private_key
    remoteRef:
      key: *secret
      property: wireguard_private_key
  - secretKey: wireguard_preshared_key
    remoteRef:
      key: *secret
      property: wireguard_preshared_key
  - secretKey: wireguard_addresses
    remoteRef:
      key: *secret
      property: wireguard_addresses
  - secretKey: wireguard_endpoint_port
    remoteRef:
      key: *secret
      property: wireguard_endpoint_port
