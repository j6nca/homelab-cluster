# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Was `sonarr-secret`, which both collided with the ExternalSecret of the
  # same name in apps/base/media/sonarr and did not match the
  # `{{ .Release.Name }}-secret` the HelmRelease mounts -- so the container
  # started with no API keys at all.
  name: recyclarr-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # Names recyclarr's `!env_var` lookups resolve against, not the
        # SONARR__AUTH__APIKEY form sonarr itself consumes.
        SONARR_API_KEY: "{{ .sonarr_apikey }}"
        RADARR_API_KEY: "{{ .radarr_apikey }}"

  data:
  - secretKey: sonarr_apikey
    remoteRef:
      key: sonarr-secret
      property: apikey
  - secretKey: radarr_apikey
    remoteRef:
      key: radarr-secret
      property: apikey
