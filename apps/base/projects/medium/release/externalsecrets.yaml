---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app medium
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # username and password come from the medium-postgres item, shared with
        # the CNPG cluster's managed role (components/postgres externalsecret)
        MEDIUM_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@medium-postgres-rw:5432/medium"

        # Creates the first administrator on a brand new instance and does
        # nothing once any user exists, so this is a bootstrap rather than a
        # standing credential.
        MEDIUM_ADMIN_EMAIL: "{{ .admin_email }}"
        MEDIUM_ADMIN_PASSWORD: "{{ .admin_password }}"

        # Film and television metadata. Absent means titles come from filenames
        # alone and nothing reaches the internet, which is a working instance —
        # so the item can carry an empty value until there is a key to put in it.
        MEDIUM_TMDB_API_KEY: "{{ .tmdb_api_key }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: medium-postgres
