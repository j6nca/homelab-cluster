---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app medium
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # username and password come from the medium-postgres item, shared with
        # the CNPG cluster's managed role (components/postgres externalsecret)
        MEDIUM_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@medium-postgres-rw:5432/medium"

        # Google sign-in. The redirect Google must have registered is
        # https://medium.j6n.dev/auth/google/callback — built from
        # MEDIUM_BASE_URL, so the two have to agree or the round trip fails at
        # Google rather than here.
        MEDIUM_GOOGLE_CLIENT_ID: "{{ .google_client_id }}"
        MEDIUM_GOOGLE_CLIENT_SECRET: "{{ .google_client_secret }}"

        # Comma separated. This gates creating an account, not signing in, so
        # removing somebody from it does not remove their access — delete the
        # user for that. The first person to sign in is always allowed and
        # becomes the administrator, which is how the instance is claimed now
        # that there is no bootstrap password.
        MEDIUM_ALLOWED_EMAILS: "{{ .allowed_emails }}"

        # May be empty. Absent just means titles come from filenames and
        # nothing about the library reaches the internet.
        MEDIUM_TMDB_API_KEY: "{{ .tmdb_api_key }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: medium-postgres
