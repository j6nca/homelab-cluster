---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medium
  annotations:
    # picked up by the gatus-sidecar: generates an uptime check for
    # this route's hostname
    gatus.home-operations.com/enabled: "true"
    # Homepage points at the external hostname rather than the internal one,
    # unlike the other apps here, because this is the origin the app actually
    # lives at: MEDIUM_BASE_URL is this name, the session cookie is set on it,
    # and Google will only return a sign-in to it. Linking the tile at the
    # internal name would bounce anyone who signed in onto this host anyway.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Medium
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-filmstrip
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=medium
spec:
  hostnames:
    - medium.j6n.dev
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: medium-app
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medium-internal
  annotations:
    # Monitoring and a LAN-local path to the same service. Signing in here
    # still ends up on medium.j6n.dev — the redirect Google hands back is
    # built from MEDIUM_BASE_URL — so this name is for probes, not for people.
    gatus.home-operations.com/enabled: "true"
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Media
      url: http://medium.j6n.internal
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - medium.j6n.internal
  rules:
    - backendRefs:
        - name: medium-app
          port: 8080
