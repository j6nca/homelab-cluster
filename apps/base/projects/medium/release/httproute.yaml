---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medium-internal
  annotations:
    # picked up by the gatus-sidecar: generates an uptime check for
    # this route's hostname
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    #
    # These moved here when the external route was removed. They pointed at
    # medium.j6n.dev because that was the origin the app lived at --
    # MEDIUM_BASE_URL, the session cookie, and the only host Google would
    # return a sign-in to. All three are this name now.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Medium
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-filmstrip
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=medium
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Media
      url: http://medium.j6n.internal
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - medium.j6n.internal
  rules:
    - backendRefs:
        - name: medium-app
          port: 8080
      # A transcode is converted in full before a single byte is served, and a
      # feature film re-encoded from HEVC takes minutes. The default request
      # timeout cuts that connection long before it finishes, so a file that
      # needs converting looks broken while the conversion is in fact still
      # running — the same default rogue-like had to turn off for a long dive.
      #
      # The conversion is not lost when a caller goes away: the server runs it
      # on its own context, bounded by its own two-hour limit rather than by
      # this one.
      timeouts:
        request: 0s
        backendRequest: 0s
