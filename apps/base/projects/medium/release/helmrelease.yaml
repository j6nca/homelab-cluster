---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app medium
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  dependsOn: []
  interval: 15m
  values:
    deployments:
      app:
        image:
          registry: ghcr.io
          repository: ctrl-research/medium
          # Pinned to a release. Merging to main cuts the next version and
          # publishes it alongside :latest — bump this deliberately rather
          # than following a moving tag, so what is running here is a thing
          # anyone can go and read the diff for.
          tag: 0.0.7
          pullPolicy: IfNotPresent

        # 0.3.0 dropped the built-in reloader annotation; the app reads its
        # secret via envFrom, so restart on rotation
        annotations:
          reloader.stakater.com/auto: "true"

        containerName: *app

        # One, and not negotiable while the cache is ReadWriteOnce: two pods
        # could not both attach it. Nothing else in the server is a singleton —
        # the job queue coordinates through Postgres — so this is a storage
        # constraint rather than an architectural one.
        replicas: 1
        # An object, not the bare string app-template accepts: the generic
        # chart passes this straight into the Deployment spec, where a string
        # is not a valid strategy. Recreate rather than a rolling update
        # because the cache PVC is ReadWriteOnce — a second pod would sit
        # unschedulable waiting for a volume the outgoing one still holds.
        strategy:
          type: Recreate

        podSecurityContext:
          # 10001 is the uid the image runs as. The fsGroup has to match or the
          # process cannot write artwork or transcodes into the cache volume.
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          # The web client is compiled into the binary, so the cache volume and
          # a temporary directory are the only writable paths it needs.
          readOnlyRootFilesystem: true

        env:
          - name: TZ
            value: America/Toronto
          - name: MEDIUM_ADDR
            value: ":8080"
          # The internal hostname now. This was https://medium.j6n.dev because
          # Google builds the OAuth redirect from it and refuses a redirect
          # that is neither https nor on a public domain -- so the sign-in
          # provider was what forced this service onto the internet, not
          # anything about the service. Authentik has no such requirement, so
          # dropping Google is what lets the external route go.
          - name: MEDIUM_BASE_URL
            value: http://medium.j6n.internal
          # Authentik sign-in only. Local accounts exist for development and for a
          # break-glass administrator, and they cannot coexist with the
          # bootstrap admin being absent: the server refuses MEDIUM_ADMIN_EMAIL
          # unless local sign-in is on, because a password account nobody can
          # sign into is not a fallback.
          - name: MEDIUM_LOCAL_AUTH
            value: "false"

          # Authentik. The issuer is the discovery document's parent -- the
          # client appends /.well-known/openid-configuration itself.
          - name: MEDIUM_OIDC_ISSUER_URL
            value: https://auth.j6n.dev/application/o/medium/
          # The sign-in button's label, nothing more.
          - name: MEDIUM_OIDC_NAME
            value: Authentik
          # Roles come from Authentik group membership rather than being set
          # per-user here. A sign-in carrying a groups claim replaces the
          # user's roles with what these map to, so removing somebody from
          # medium_admin demotes them on their next sign-in rather than
          # needing anything changed in medium.
          #
          # admin and user are the only roles medium defines.
          - name: MEDIUM_OIDC_GROUP_ROLES
            value: medium_admin=admin,medium_user=user
          # Anyone who authenticates but matches no mapped group. Deliberately
          # the lesser role: being known to Authentik should not by itself
          # confer administration.
          - name: MEDIUM_OIDC_DEFAULT_ROLE
            value: user
          - name: MEDIUM_CACHE_DIR
            value: /cache

          # Sign-in attempts are counted against the caller's address, and
          # behind a gateway every request arrives from the gateway. Without
          # this the whole house shares one allowance and one person mistyping
          # a password locks everybody out; with it the forwarded header is
          # believed, but only from inside the cluster. Talos' default pod
          # network — widen it here if the cluster's podSubnets differ.
          - name: MEDIUM_TRUSTED_PROXIES
            value: 10.244.0.0/16

          # Well under the 20Gi volume: the server evicts least-recently-used
          # transcodes to stay beneath this, and artwork shares the same disk.
          # Lyrics for music that has none beside it or in its tags, fetched
          # from lrclib.net. This is the one setting here that sends anything
          # about the library outwards: the artist, title, album and duration
          # of tracks with no words yet. Tracks that already have lyrics are
          # never sent, and a track LRCLIB does not know is remembered as such
          # rather than asked about again every scan.
          - name: MEDIUM_LRCLIB
            value: "true"
          - name: MEDIUM_TRANSCODE_CACHE_MAX_BYTES
            value: "12884901888"

        envFrom:
          # MEDIUM_DATABASE_URL, the Authentik client, and the allowlist
          - secretRef:
              name: *app

        ports:
          - containerPort: 8080
            name: http
            protocol: TCP

        # A scan of a large library runs for a long time in the background, but
        # it runs in the job queue rather than in the request path, so the
        # server answers throughout. Nothing here needs a long startup grace.
        livenessProbe:
          httpGet:
            path: &health /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: *health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # Transcoding is software x264 — there is no hardware acceleration
            # configured — so a single conversion can use most of a core for
            # minutes. No CPU limit deliberately: a throttled transcode stalls
            # playback, and the queue already bounds how many run at once.
            memory: 2Gi

        volumes:
          - name: cache
            persistentVolumeClaim:
              claimName: medium-cache
          - name: tmp
            emptyDir: {}
          # The library itself. Read-only at the mount as well as in the
          # server: Medium opens media files for reading and writes only into
          # its cache directory, and the mount says so independently of that.
          - name: media
            nfs:
              server: mimir.internal
              path: /var/nfs/shared/MEDIA

        volumeMounts:
          - name: cache
            mountPath: /cache
          - name: tmp
            mountPath: /tmp
          - name: media
            mountPath: /media
            readOnly: true
            subPath: data/media

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: http
            protocol: TCP
            name: http
