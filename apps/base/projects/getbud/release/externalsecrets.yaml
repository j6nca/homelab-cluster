---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app getbud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        GETBUD_GOOGLE_CLIENT_ID: "{{ .google_client_id }}"
        GETBUD_GOOGLE_CLIENT_SECRET: "{{ .google_client_secret }}"
        # password comes from the getbud-postgres item, shared with the
        # CNPG cluster's managed role (components/postgres externalsecret)
        GETBUD_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@getbud-postgres-rw:5432/getbud"
        GETBUD_ALLOWED_EMAILS: "{{ .allowed_emails }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: getbud-postgres
