---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app getbud
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      getbud:
        containers:
          app:
            image:
              repository: ghcr.io/ctrl-research/getbud
              tag: 0.0.1
            env:
              TZ: America/Toronto
              GETBUD_ADDR: ":8080"
              GETBUD_BASE_URL: https://budget.j6n.dev
              GETBUD_LOCAL_AUTH: "false"
            envFrom:
              # google oauth client (1Password item: getbud)
              - secretRef:
                  name: *app
            ports:
              - containerPort: &port 8080
                name: http
                protocol: TCP
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      tmp:
        type: emptyDir

    route:
      app:
        hostnames:
          - budget.j6n.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    service:
      app:
        ports:
          http:
            port: *port
