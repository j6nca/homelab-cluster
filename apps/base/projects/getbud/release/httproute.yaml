---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: getbud
  annotations:
    # picked up by the gatus-sidecar: generates an uptime check for
    # this route's hostname
    gatus.home-operations.com/enabled: "true"
spec:
  hostnames:
    - budget.j6n.dev
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: getbud-app
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: getbud-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Self-Hosted
      url: http://getbud.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - getbud.j6n.internal
  rules:
  - backendRefs:
    - name: getbud-app
      port: 8080
