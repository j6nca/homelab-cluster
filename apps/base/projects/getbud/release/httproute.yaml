---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: getbud
  annotations:
    # picked up by the gatus-sidecar: generates an uptime check for
    # this route's hostname
    gatus.home-operations.com/enabled: "true"
spec:
  hostnames:
    - budget.j6n.dev
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: getbud-app
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: getbud-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: GetBud
    gethomepage.dev/group: Self-Hosted
    gethomepage.dev/icon: mdi-cash
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=getbud
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Self-Hosted
      url: http://getbud.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - getbud.j6n.internal
  rules:
  - backendRefs:
    - name: getbud-app
      port: 8080
