# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mmo-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # The bus is how the two halves reach each other, so neither is any use
  # before it exists. Without this they crash-loop until NATS turns up, which
  # recovers on its own but makes a first install look broken.
  #
  # The postgres and dragonfly components append cnpg and dragonfly-operator to
  # this list, so it has to be a list they can append to.
  dependsOn:
    - name: mmo-nats
  interval: 15m
  values:
    controllers:
      mmo-gateway:
        annotations:
          reloader.stakater.com/auto: "true"
        # ONE replica, and not because a gateway cannot be scaled -- it runs no
        # simulation and holds no character state, which is the entire point of
        # splitting it out.
        #
        # It is one because SESSION_SECRET is not set yet (see
        # externalsecrets.yaml: the 1Password item does not exist). Without it
        # each gateway generates its own signing key at boot, so a ticket
        # issued over HTTP by one gateway is rejected by whichever gateway the
        # WebSocket lands on. With one replica that is invisible. With two it
        # is a login that fails roughly half the time.
        #
        # Raise this the same day the secret exists, not before.
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/ctrl-research/mmo/server
              # Same tag as the world nodes and the client. See the note there.
              tag: 0.2.23
            args:
              - "--roles=gateway"
              - "--addr=:8080"
              - "--admin-addr=0.0.0.0:9090"
              # A gateway with no world node of its own reaches one over the
              # bus and finds it through the directory, so it refuses to start
              # without both rather than timing out every login.
              #
              # No --client-dir: the client is a separate Deployment served by
              # nginx, joined to this one at the route.
              #
              # No --dev-auth. That issues game tickets with no identity check
              # whatsoever. --local-auth (on by default) plus the allowlist is
              # the real path.
              #
              # No --origins: empty means same-origin only, which is exactly
              # what the single-hostname routing preserves.
              #
              # --secure-cookies stays off while this is on envoy-internal,
              # which has no TLS listener. Turn it on the same day this moves
              # to envoy-external, or session cookies will not be sent.
              - "--log-json"
              # TEMPORARY, for diagnosing logins failing with "could not enter
              # the world". A refused entry is returned to the client and never
              # logged above debug: acceptEnter puts the reason in the reply,
              # placeAndJoin returns it untouched, and the gateway drops it in
              # session.go's `s.log.Debug("session ended", ...)`. This is the
              # only way to read it without a new image. Revert once the cause
              # is known.
              - "--log-level=debug"
            env:
              TZ: America/Toronto
              PUBLIC_URL: http://mmo.j6n.internal
              # Both halves must agree on which bus and which directory, or
              # they are two clusters that cannot see each other.
              NATS_URL: nats://mmo-nats:4222
              # Seeded here rather than on the world nodes: signing in is the
              # gateway's job, and seeding it on both would have every world
              # node reassert the same six rows on every boot.
              #
              # Additive: names not listed here are left alone, so anyone added
              # later with `mmo allow` survives a rollout. But a name that
              # stays here is re-asserted on every boot, so revoking someone
              # for good means deleting them from this line too, not just
              # running `mmo revoke`.
              SEED_ALLOWLIST: jonathan,test1,test2,test3,test4,test5
            envFrom:
              - secretRef:
                  name: mmo
            ports:
              - containerPort: &port 8080
                name: http
                protocol: TCP
              - containerPort: 9090
                name: admin
                protocol: TCP
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                # Lighter than a world node: no tick loop, no rooms. It moves
                # bytes between a socket and the bus.
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Matches the distroless nonroot user the image ships with.
        runAsUser: 65532
        runAsGroup: 65532

    service:
      app:
        ports:
          http:
            port: *port
          admin:
            port: 9090
