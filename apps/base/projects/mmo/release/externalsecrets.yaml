---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app mmo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # password comes from the mmo-postgres item, shared with the CNPG
        # cluster's managed role (components/postgres externalsecret), so the
        # string the server dials with and the one the role is created with
        # cannot drift.
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@mmo-postgres-rw:5432/mmo?sslmode=disable"
        # A bare host:port, NOT a URL -- the server reads REDIS_ADDR and passes
        # it straight to the client. `redis://...` here parses as a hostname
        # and fails to dial. (deploy/docker-compose.yml sets REDIS_URL, which
        # the server never reads at all; see the note in the PR.)
        REDIS_ADDR: "mmo-dragonfly:6379"
        # TEMPORARILY DISABLED. The `mmo` 1Password item does not exist yet,
        # and an explicit data ref to a missing property fails the WHOLE
        # ExternalSecret -- so this one line also stopped DATABASE_URL and
        # REDIS_ADDR from rendering, the Secret was never created, and the
        # server pod could not start at all.
        #
        # While this is off the server generates a random secret at boot,
        # which signs every player out on any restart or rollout. Restore it
        # once the item exists.
        # SESSION_SECRET: "{{ .session_secret }}"
  data:
    # Explicit refs rather than a dataFrom extract: an extract renders a
    # missing or renamed field as an empty string, and an empty SESSION_SECRET
    # is indistinguishable at boot from a deliberately unset one.
    #
    # Restore alongside the SESSION_SECRET template line above once the `mmo`
    # item exists with a session_secret property:
    # - secretKey: session_secret
    #   remoteRef:
    #     key: *app
    #     property: session_secret
    - secretKey: username
      remoteRef:
        key: mmo-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: mmo-postgres
        property: password
