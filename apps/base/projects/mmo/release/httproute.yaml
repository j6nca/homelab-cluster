# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mmo-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: MMO
    gethomepage.dev/group: Self-Hosted
    gethomepage.dev/icon: mdi-sword-cross
    # Points at the client, which is what a person opening the tile wants.
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=mmo-client
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Self-Hosted
      url: http://mmo.j6n.internal/healthz
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  # One hostname for both halves. This is the whole point of the split: the
  # browser only ever sees http://mmo.j6n.internal, so the WebSocket's Origin
  # matches its Host and the server's same-origin check passes without an
  # --origins allowlist. Serving the client from a second hostname would mean
  # weakening that guard, which client/vite.config.ts argues against at length.
  hostnames:
  - mmo.j6n.internal
  rules:
  # Gateway API matches the longest path prefix first regardless of the order
  # these appear in, so the catch-all below cannot shadow them.
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /ws
    - path:
        type: PathPrefix
        value: /healthz
    # OIDC redirects land on /auth/callback. Routed even though only
    # --local-auth is enabled today, so turning providers on is a config
    # change rather than a routing change.
    - path:
        type: PathPrefix
        value: /auth
    backendRefs:
    - name: mmo-server
      port: 8080
  # Everything else is the client bundle, including deep links: nginx falls
  # back to index.html so the SPA renders rather than 404ing.
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: mmo-client
      port: 8080
