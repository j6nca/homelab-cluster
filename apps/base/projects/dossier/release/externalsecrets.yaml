---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app dossier
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # A LiteLLM virtual key rather than the master key: triage is the only
        # thing here that spends tokens, and a per-app key is what makes the
        # spend attributable in LiteLLM's own logs.
        DOSSIER_LLM_API_KEY: "{{ .litellm_key }}"
  data:
    # Explicit ref rather than a dataFrom extract: an extract renders a missing
    # or renamed field as an empty string, which here would mean an empty key
    # and a 401 from LiteLLM on the first triage rather than at deploy time.
    - secretKey: litellm_key
      remoteRef:
        key: litellm-dossier
        property: password
