# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dossier-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Dossier
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: mdi-file-document-alert
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Observability
      url: http://dossier.j6n.internal/healthz
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - dossier.j6n.internal
  rules:
  # Internal only, and deliberately not on envoy-external. The UI has no auth
  # of its own, its mutating endpoints have no CSRF protection yet, and the
  # incident view carries every label off every alert in the cluster.
  - backendRefs:
    - name: dossier
      port: 8080
