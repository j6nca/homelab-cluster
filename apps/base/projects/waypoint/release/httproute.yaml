# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waypoint-external
  annotations:
    # group: External inherited from the envoy-external gateway
    gatus.home-operations.com/enabled: "true"
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
  hostnames:
  - travel.j6n.dev
  rules:
  - backendRefs:
    - name: waypoint
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waypoint-internal
  annotations:
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Waypoint
    gethomepage.dev/group: Self-Hosted
    gethomepage.dev/icon: mdi-map-marker-path
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=waypoint
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Self-Hosted
      url: http://waypoint.j6n.internal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - waypoint.j6n.internal
  rules:
  - backendRefs:
    - name: waypoint
      port: 8080
