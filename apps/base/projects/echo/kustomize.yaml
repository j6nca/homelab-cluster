---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app echo
  namespace: flux-system
spec:
  # No postgres component any more. Echo is a client now: the library and its
  # metadata, playlists, favourites, and play history all live in Jellyfin, so
  # there is nothing left for it to store. Removing the component prunes the
  # CNPG Cluster and Database along with their volume.
  targetNamespace: *app
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/projects/echo/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
