---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # No externalsecrets: the client holds no credentials of its own. It
  # authenticates to Jellyfin from the browser, and that token lives on the
  # listener's device rather than in the cluster.
  - ./helmrelease.yaml
  - ./httproute.yaml
