---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app echo
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  dependsOn: []
  interval: 15m
  values:
    deployments:
      app:
        image:
          registry: ghcr.io
          # The client image, not the standalone server: static files behind
          # nginx, with no database and no yt-dlp. The server image is still
          # published from the same repo under ctrl-research/echo.
          repository: ctrl-research/echo-client
          tag: 0.3.0
          pullPolicy: IfNotPresent

        containerName: *app

        # Two, and a rolling update, both of which the standalone server could
        # not have: there are no ReadWriteOnce volumes to contend over and no
        # singleton filesystem watcher. The pod holds nothing but a copy of the
        # built assets, so rollouts are now zero-downtime.
        replicas: 2

        env:
          - name: TZ
            value: America/Toronto

        ports:
          - containerPort: 8080
            name: http
            protocol: TCP

        # Static files: if nginx is listening it is serving. No startupProbe,
        # because there is no migration or scan to wait on — the old one existed
        # for a database that no longer exists.
        livenessProbe:
          httpGet:
            path: &health /index.html
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: *health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10

        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        podSecurityContext:
          # 101 is the uid baked into nginx-unprivileged.
          runAsUser: 101
          runAsGroup: 101
          runAsNonRoot: true

        # Required by readOnlyRootFilesystem: nginx writes its pid to /tmp and
        # buffers request bodies and proxy responses under /var/cache/nginx.
        # Without both it fails to start rather than degrading.
        volumes:
          - name: tmp
            emptyDir: {}
          - name: cache
            emptyDir: {}

        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: cache
            mountPath: /var/cache/nginx

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: http
            protocol: TCP
            name: http
