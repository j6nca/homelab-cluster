---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app echo
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  # cnpg is appended by the components/postgres patch.
  dependsOn: []
  interval: 15m
  values:
    deployments:
      app:
        image:
          registry: ghcr.io
          repository: ctrl-research/echo
          tag: 0.1.0
          pullPolicy: IfNotPresent

        # The database URL and bootstrap admin arrive via envFrom, so restart
        # on rotation.
        annotations:
          reloader.stakater.com/auto: "true"

        containerName: *app

        replicas: 1
        # Recreate, not the default rolling update. The volumes are
        # ReadWriteOnce, so a second pod cannot attach them while the first
        # still holds them, and the library watcher must be a singleton — two
        # would each observe every event and enqueue duplicate work.
        strategy:
          type: Recreate

        env:
          - name: TZ
            value: America/Toronto
          # The image's home directory sits on the read-only root filesystem,
          # and yt-dlp writes an extractor cache under $HOME. It degrades to
          # warnings rather than failing, but pointing it at the tmp emptyDir
          # keeps the log clean and the cache useful.
          - name: HOME
            value: /tmp
          - name: ECHO_ADDR
            value: ":8080"
          # Scheme matters beyond cosmetics: the session cookie is marked
          # Secure only when this is https, and a Secure cookie sent over the
          # http-only internal gateway would be dropped by the browser, which
          # presents as "login succeeds then immediately logs out".
          - name: ECHO_BASE_URL
            value: http://echo.j6n.internal
          - name: ECHO_CACHE_DIR
            value: /cache
          # Only the writable root for now: promoted YouTube downloads land
          # here.
          - name: ECHO_LIBRARY_ROOTS
            value: /library/downloads
          # Password sign-in, to be replaced by Authentik. The bootstrap admin
          # is created only while the users table is empty.
          - name: ECHO_LOCAL_AUTH
            value: "true"
          # Both caches live on the same 8Gi volume, so both ceilings are set
          # and sized to sum well below it — the defaults (5GB + 10GB) would
          # overcommit it almost twofold. Eviction is reactive, running after a
          # write lands, so the slack matters: without it a burst fills the
          # disk and every subsequent write fails with ENOSPC instead of the
          # cache simply making room.
          - name: ECHO_YT_CACHE_MAX_BYTES
            value: 4GB
          - name: ECHO_TRANSCODE_CACHE_MAX_BYTES
            value: 2GB
          - name: ECHO_YT_CACHE_TTL
            value: 48h
          - name: ECHO_LOG_LEVEL
            value: info

        envFrom:
          # ECHO_DATABASE_URL, ECHO_ADMIN_EMAIL, ECHO_ADMIN_PASSWORD
          - secretRef:
              name: *app

        ports:
          - containerPort: 8080
            name: http
            protocol: TCP

        livenessProbe:
          httpGet:
            path: &health /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: *health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: *health
            port: http
          # Generous: migrations run at startup, and a cold CNPG cluster can
          # take a while to accept connections. The library scan is a
          # background job and does not gate readiness.
          failureThreshold: 30
          periodSeconds: 10

        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            # ffmpeg transcoding and yt-dlp are the only heavy work, and both
            # are bounded by the job workers.
            cpu: "2"
            memory: 1Gi

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        podSecurityContext:
          # 10001, not the usual 1000: the image creates its own user at that
          # uid and chowns /cache and /library to it, so running as anything
          # else leaves both unwritable.
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch

        volumes:
          - name: cache
            persistentVolumeClaim:
              claimName: echo-cache
          - name: downloads
            persistentVolumeClaim:
              claimName: echo-downloads
          # Required, not incidental: the root filesystem is read-only, and
          # both yt-dlp and the transcoder stage output through temp files.
          - name: tmp
            emptyDir: {}

        volumeMounts:
          - name: cache
            mountPath: /cache
          - name: downloads
            mountPath: /library/downloads
          - name: tmp
            mountPath: /tmp

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: http
            protocol: TCP
            name: http

    persistentVolumeClaims:
      # Disposable: transcodes rebuild on demand, extracted art on rescan, and
      # YouTube items re-download. Sized so the app's own cache ceilings have
      # headroom above them rather than fighting the volume for space.
      cache:
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 8Gi

      # Not disposable. Promoted YouTube downloads are the only copy once the
      # cache entry expires.
      downloads:
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
