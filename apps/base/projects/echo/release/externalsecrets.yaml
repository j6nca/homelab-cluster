---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app echo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # username/password come from the echo-postgres item, shared with the
        # CNPG cluster's managed role (components/postgres externalsecret)
        ECHO_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@echo-postgres-rw:5432/echo"
        # Seeds the first account, and only while the users table is empty —
        # rotating these later does not change an existing password.
        ECHO_ADMIN_EMAIL: "{{ .admin_email }}"
        ECHO_ADMIN_PASSWORD: "{{ .admin_password }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: echo-postgres
