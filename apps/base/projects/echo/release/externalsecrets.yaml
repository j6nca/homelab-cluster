---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app echo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # username/password come from the echo-postgres item, shared with the
        # CNPG cluster's managed role (components/postgres externalsecret)
        ECHO_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@echo-postgres-rw:5432/echo"
        # Sign-in is Authentik only. The issuer and the button label are plain
        # env in the helmrelease, being config rather than secrets; the app
        # refuses to start unless all three are present, so a failure to sync
        # this item surfaces at startup rather than at the sign-in button.
        ECHO_OIDC_CLIENT_ID: "{{ .client_id }}"
        ECHO_OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    # OIDC client credentials, from the `echo-oidc` 1Password item. Explicit
    # refs rather than a dataFrom extract: an extract silently renders a
    # missing or renamed field as an empty string, which here would mean an
    # empty client_id and an opaque SSO failure.
    - secretKey: client_id
      remoteRef:
        key: echo-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: echo-oidc
        property: client_secret
  dataFrom:
    - extract:
        key: echo-postgres
