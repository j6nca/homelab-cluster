---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app echo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    template:
      data:
        # Sign-in is Google only; both halves must be present or the app
        # refuses to start. From the `echo` item, same shape as waypoint.
        ECHO_GOOGLE_CLIENT_ID: "{{ .google_client_id }}"
        ECHO_GOOGLE_CLIENT_SECRET: "{{ .google_client_secret }}"
        # username/password come from the echo-postgres item, shared with the
        # CNPG cluster's managed role (components/postgres externalsecret)
        ECHO_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@echo-postgres-rw:5432/echo"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: echo-postgres
