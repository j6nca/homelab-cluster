---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overwatch-internal
  annotations:
    # picked up by the gatus-sidecar: generates an uptime check for
    # this route's hostname
    gatus.home-operations.com/enabled: "true"
    # Discovered by homepage from this route; group mirrors the gatus
    # endpoint below, so the two dashboards stay in step.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Overwatch
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: mdi-radar
    # Without this homepage looks for app.kubernetes.io/name=<the
    # display name above> and renders 'not found' when it misses.
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=overwatch
    # sidecar defaults HTTPRoutes to https; envoy-internal is http-only
    gatus.home-operations.com/endpoint: |
      group: Tools
      url: http://overwatch.j6n.internal/api/v1/health
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - overwatch.j6n.internal
  rules:
    # The web client, the API and the MCP endpoint (/mcp) for agents on the
    # network, all on the one service.
    - backendRefs:
        - name: overwatch-app
          port: 8080
