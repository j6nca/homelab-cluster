---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app overwatch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # username and password come from the overwatch-postgres item, shared
        # with the CNPG cluster's managed role (components/postgres)
        OVERWATCH_DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@overwatch-postgres-rw:5432/overwatch"

        # Fine-grained GitHub token for the org being synced: read access to
        # issues, pull requests and metadata on all its repositories, plus
        # write to issues and pull requests if edits from the UI should reach
        # GitHub. The provisioned source has no token of its own, so this is
        # the one every sync uses.
        OVERWATCH_GITHUB_TOKEN: "{{ .github_token }}"

        # 32 random bytes, base64 (`overwatch generate-key`). Encrypts tokens
        # a source stores itself; none does yet, but the server refuses to
        # start without it once one does, and losing it makes them unreadable.
        OVERWATCH_ENCRYPTION_KEY: "{{ .encryption_key }}"

        # Authentik sign-in. The redirect URI its provider must have is
        #
        #   http://overwatch.j6n.internal/api/v1/auth/oidc/callback
        #
        # built from OVERWATCH_BASE_URL, so the two have to agree.
        OVERWATCH_OIDC_CLIENT_ID: "{{ .client_id }}"
        OVERWATCH_OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  # Named fields rather than extracting the overwatch and overwatch-oidc items
  # whole: a 1Password item carries username and password whether or not they
  # mean anything, which would collide with the postgres item's — the exact
  # names the database URL above is built from.
  data:
    - secretKey: github_token
      remoteRef:
        key: overwatch
        property: github_token
    - secretKey: encryption_key
      remoteRef:
        key: overwatch
        property: encryption_key
    - secretKey: client_id
      remoteRef:
        key: overwatch-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: overwatch-oidc
        property: client_secret
  dataFrom:
    - extract:
        key: overwatch-postgres
