---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app overwatch
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: ctrl-research
        namespace: flux-system
      version: 0.3.0
  dependsOn: []
  interval: 15m
  values:
    configmaps:
      # Overwatch's own provisioning file: what to sync and who gets which
      # role. Applied at every start, before the first sync, and everything it
      # declares is read-only in the UI. Removing an entry deletes it on the
      # next start, a source along with everything synced from it. Reloader
      # restarts the pod when this changes, which is what applies it.
      provisioning:
        data:
          overwatch.yaml: |
            sources:
              - name: ctrl-research
                type: github
                # Every repository in the org the token can see: with the
                # jarvisctl token, that is all of its public repositories plus
                # the private ones the token was granted. Use
                # `repos: [owner/name, ...]` instead to sync only some.
                config:
                  org: ctrl-research
            oidc:
              # An Authentik user gets the highest role among these groups.
              # Anyone in none of them is refused (no default role is set).
              group_roles:
                - group: overwatch_admin
                  role: admin
                - group: overwatch_editor
                  role: editor
                - group: overwatch_reader
                  role: reader

    deployments:
      app:
        image:
          registry: ghcr.io
          repository: ctrl-research/overwatch
          # The first release (ctrl-research/overwatch#9). Pinned: bump it
          # deliberately rather than following :latest.
          tag: 0.1.0
          pullPolicy: IfNotPresent

        # Restart when the secret or the provisioning file changes.
        annotations:
          reloader.stakater.com/auto: "true"

        containerName: *app

        # One. Each pod runs its own sync loop and its own sign-in rate limit;
        # a second would double every GitHub request without making anything
        # faster. Nothing on disk, so a rolling update is fine.
        replicas: 1

        podSecurityContext:
          # The uid the image runs as.
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          # The web client is compiled into the binary and all state is in
          # Postgres; nothing but a temporary directory is written.
          readOnlyRootFilesystem: true

        env:
          - name: TZ
            value: America/Toronto
          - name: OVERWATCH_ADDR
            value: ":8080"
          # Must match the HTTPRoute's hostname: the OIDC callback is built
          # from it, and browser writes are refused unless their Origin is it.
          - name: OVERWATCH_BASE_URL
            value: http://overwatch.j6n.internal
          - name: OVERWATCH_LOG_LEVEL
            value: info

          # Authentik only. Admins come from the overwatch_admin group, re-read
          # at every sign-in. With no password mode there is no bootstrap
          # "admin" account, so no break-glass login either: if Authentik is
          # unavailable, recover by declaring an account with a password_hash
          # in the provisioning file and switching this to password,oidc.
          # Agents use API tokens, made in the UI, either way.
          - name: OVERWATCH_AUTH_MODE
            value: oidc
          # The discovery document's parent; the client appends
          # /.well-known/openid-configuration itself.
          - name: OVERWATCH_OIDC_ISSUER
            value: https://auth.j6n.dev/application/o/overwatch/
          # The sign-in button's label.
          - name: OVERWATCH_OIDC_NAME
            value: Authentik

          - name: OVERWATCH_PROVISIONING_PATH
            value: /etc/overwatch
          # How often every repository is polled. Each poll of an unchanged
          # repository costs a few requests against the token's 5000 an hour.
          - name: OVERWATCH_SYNC_INTERVAL
            value: 5m

        envFrom:
          # The database URL, GitHub token, encryption key and Authentik client
          - secretRef:
              name: *app

        ports:
          - containerPort: 8080
            name: http
            protocol: TCP

        livenessProbe:
          httpGet:
            path: &health /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: *health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15

        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 512Mi

        volumes:
          - name: provisioning
            configMap:
              name: overwatch-provisioning
          - name: tmp
            emptyDir: {}

        volumeMounts:
          - name: provisioning
            mountPath: /etc/overwatch
            readOnly: true
          - name: tmp
            mountPath: /tmp

    services:
      app:
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: http
            protocol: TCP
            name: http
