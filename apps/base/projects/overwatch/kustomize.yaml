---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app overwatch
  namespace: flux-system
spec:
  components:
    - ../../../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      POSTGRES_REPLICAS: "1"
      # Issues, pull requests, labels and agent task history for one GitHub
      # org: text and timestamps, no attachments. Small even for a busy org,
      # and a Longhorn volume can be grown later (never shrunk), so start low.
      POSTGRES_SIZE: 1Gi
  targetNamespace: *app
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/projects/overwatch/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
