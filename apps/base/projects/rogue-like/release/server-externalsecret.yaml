# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rogue-like-server-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      data:
        # The join password for the dedicated game server. Empty would mean an OPEN
        # server, so this is what stops anyone who resolves rogue-game.j6n.dev from
        # taking a crew seat and forcing dives.
        #
        # Via 1Password rather than committed, because this repo is PUBLIC — a
        # password in a manifest here is a password published to the world, which is
        # the same as having none.
        JOIN_PASSWORD: "{{ .join_password }}"
  data:
  - secretKey: join_password
    remoteRef:
      key: rogue-like-server
      property: join_password
