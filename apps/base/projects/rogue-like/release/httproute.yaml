# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rogue-like-signaling-external
  annotations:
    # group: external inherited from the envoy-external gateway
    gatus.home-operations.com/enabled: "true"
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
  hostnames:
  - lobby.j6n.dev
  # Transitional: the currently-deployed Pages build still points at
  # dive-control; drop this hostname once the next game deploy is live.
  - dive-control.j6n.dev
  rules:
  - backendRefs:
    - name: rogue-like-signaling
      port: 9080
