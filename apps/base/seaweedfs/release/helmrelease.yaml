# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
spec:
  chart:
    spec:
      chart: seaweedfs
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      # pin exactly and review bumps: the S3 gateway is the fastest-moving
      # layer and buzz depends on its conditional-write (CAS) semantics —
      # buzz's startup conformance probe re-validates on every upgrade
      version: 4.40.0
  interval: 15m
  values:
    # single-pod mode: master + volume + filer + S3 gateway in one
    # deployment, one PVC. Longhorn handles replication/snapshots, so
    # SeaweedFS-level replication stays off (000 default).
    master:
      enabled: false
      # per-volume file size cap, also the divisor for the volume server's
      # auto max-volume count (-volume.max=0): free space / this. The chart
      # default of 1000 leaves only ~4 possible volumes on a 5Gi PVC, and
      # allocation fails outright once free space drops under one volume's
      # worth — which surfaces as an S3 500 InternalError on write. 250
      # gives ~18 and matches the few-GB scale we expect here.
      # allInOne reads these master.* values even with master.enabled=false
      volumeSizeLimitMB: 250
    volume:
      enabled: false
    filer:
      enabled: false

    allInOne:
      enabled: true
      s3:
        enabled: true
        # buckets are created by a post-install/upgrade hook Job.
        # NOTE: keep versioning off — SeaweedFS conditional writes (which
        # buzz's CAS depends on) are broken on versioned buckets
        # (seaweedfs#8073)
        createBuckets:
          - name: buzz-media
            anonymousRead: false
      data:
        # 1Gi holds ~3 volumes at volumeSizeLimitMB=250. Longhorn supports
        # online expansion if media outgrows it — shrinking needs the PVC
        # recreated, since storage requests are immutable downward.
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    s3:
      enableAuth: true
      # key seaweedfs_s3_config: identities JSON declaring the admin key
      # and the buzz key (Read/Write/List on buzz-media only)
      existingConfigSecret: seaweedfs-s3-config
