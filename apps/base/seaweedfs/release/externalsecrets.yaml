---
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    # this is how the Kind=Secret will look like
    # the chart mounts this key as the -s3.config identities file
    template:
      data:
        seaweedfs_s3_config: |
          {
            "identities": [
              {
                "name": "admin",
                "credentials": [
                  {"accessKey": "{{ .admin_access_key }}", "secretKey": "{{ .admin_secret_key }}"}
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              },
              {
                "name": "buzz",
                "credentials": [
                  {"accessKey": "{{ .buzz_access_key }}", "secretKey": "{{ .buzz_secret_key }}"}
                ],
                "actions": ["Read:buzz-media", "Write:buzz-media", "List:buzz-media"]
              }
            ]
          }
  # explicit per-property refs so a renamed/missing field fails the sync
  # loudly instead of rendering an empty credential into the identities file
  data:
    - secretKey: admin_access_key
      remoteRef:
        key: seaweedfs
        property: admin_access_key
    - secretKey: admin_secret_key
      remoteRef:
        key: seaweedfs
        property: admin_secret_key
    - secretKey: buzz_access_key
      remoteRef:
        key: seaweedfs
        property: buzz_access_key
    - secretKey: buzz_secret_key
      remoteRef:
        key: seaweedfs
        property: buzz_secret_key
