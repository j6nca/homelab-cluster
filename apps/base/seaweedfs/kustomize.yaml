---
# NOT DEPLOYED. clusters/homelab/apps/seaweedfs was removed along with buzz,
# its only consumer — nothing else in the cluster reads from it. Kept here so
# re-enabling is a matter of restoring that directory plus the seaweedfs entry
# under clusters/homelab/repos/helm.
#
# The volumes this used to back are gone: the prune deleted the 1Gi PVC and
# with it the buzz-media bucket, so a redeploy starts empty.
# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seaweedfs
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  targetNamespace: *app
  commonMetadata:
    labels:
      service: *app
  interval: 5m
  path: ./apps/base/seaweedfs/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
