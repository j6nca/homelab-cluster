# yaml-language-server: $schema=https://thanoslabs.github.io/k8s-schemas/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: longhorn
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: homelab
  folderRef: storage
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  grafanaCom:
    id: 16888
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: longhorn-health-capacity
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: homelab
  folderRef: storage
  url: https://raw.githubusercontent.com/j6nca/homelab-cluster/main/dashboards/storage/longhorn-health.json
