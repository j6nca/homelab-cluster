# yaml-language-server: $schema=https://ctrl-research.github.io/k8s-schemas/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: vlc-0
spec:
  sourcePVC: vlstorage-volume-vlc-victoria-logs-cluster-vlstorage-0
  trigger:
    # Run backup daily @ midnight
    schedule: "0 0 * * *"
  restic:
    pruneIntervalDays: 7
    # Name of secret with bucket config
    repository: vlc-0-replication
    # Backup retention policy
    retain:
      daily: 7
    # Use Snapshot method for longhorn
    copyMethod: Snapshot
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  # vlc-1, not vmks-1: this and the victoria-metrics stack both deploy into
  # observability, so the old name collided with that stack's own vmks-1 and
  # the two Flux Kustomizations fought over one object.
  name: vlc-1
spec:
  sourcePVC: vlstorage-volume-vlc-victoria-logs-cluster-vlstorage-1
  trigger:
    # Run backup daily @ midnight
    schedule: "0 0 * * *"
  restic:
    pruneIntervalDays: 7
    # Name of secret with bucket config
    repository: vlc-1-replication
    # Backup retention policy
    retain:
      daily: 7
    # Use Snapshot method for longhorn
    copyMethod: Snapshot
