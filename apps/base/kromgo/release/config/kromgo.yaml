# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kromgo/0.16.2/config.schema.json
# Served publicly on kromgo.j6n.dev for the README badges on j6nca/homelab-cluster.
# Only the endpoints defined here are reachable; vmselect itself is not exposed.
# Each badge is /badges/<id>; the gallery at / shows them with Markdown snippets.
prometheus: http://vmselect-vmks-victoria-metrics-k8s-stack.observability.svc:8481/select/0/prometheus
cache:
  enabled: true
  maxAge: 300
defaults:
  badge:
    style: for-the-badge
badges:
  - id: talos_version
    title: Talos
    icon: si:talos
    # os_image is "Talos (v1.x.y)"; most common value across nodes
    query: 'label_replace(topk(1, count by (os_image) (kube_node_info)), "version", "$1", "os_image", "Talos \\((v[^)]+)\\)")'
    valueExpr: labels[?"version"].orValue("unknown")
    colorExpr: '"blue"'
  - id: kubernetes_version
    title: Kubernetes
    icon: si:kubernetes
    query: topk(1, count by (kubelet_version) (kube_node_info))
    valueExpr: labels[?"kubelet_version"].orValue("unknown")
    colorExpr: '"blue"'
  - id: flux_version
    title: Flux
    icon: si:flux
    # revision is "v2.7.5@sha256:..."; scraped from flux-operator by the
    # flux-operator PodMonitor in apps/base/flux-system/monitoring
    query: 'label_replace(flux_instance_info{kind="FluxInstance"}, "version", "$1", "revision", "(v[^@]+)@.*")'
    valueExpr: labels[?"version"].orValue("unknown")
    colorExpr: 'labels[?"ready"].orValue("") == "True" ? "blue" : "orange"'
  - id: cluster_age_days
    title: Age
    icon: mdi:calendar-clock
    query: time() - min(kube_namespace_created{namespace="kube-system"})
    valueExpr: humanizeDurationDays(result)
    colorExpr: '"blue"'
  - id: cluster_uptime
    title: Uptime
    icon: mdi:timer-outline
    query: round(avg(time() - node_boot_time_seconds), 3600)
    valueExpr: humanizeDuration(result)
    colorExpr: '"blue"'
  - id: cluster_node_count
    title: Nodes
    icon: mdi:server-outline
    query: count(kube_node_status_condition{condition="Ready", status="true"} == 1)
    valueExpr: humanizeCommas(result)
    colorExpr: '"blue"'
  - id: cluster_pod_count
    title: Pods
    icon: mdi:cube-outline
    query: sum(kube_pod_status_phase{phase="Running"})
    valueExpr: humanizeCommas(result)
    colorExpr: '"blue"'
  - id: cluster_cpu_usage
    title: CPU
    icon: mdi:cpu-64-bit
    query: round(100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))), 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: colorScale(result, [35.0, 75.0], ["green", "orange", "red"])
  - id: cluster_memory_usage
    title: Memory
    icon: mdi:memory
    query: round(100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)), 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: colorScale(result, [60.0, 85.0], ["green", "orange", "red"])
  - id: cluster_alert_count
    title: Alerts
    icon: mdi:bell-alert-outline
    # Watchdog/InfoInhibitor always fire by design
    query: count(ALERTS{alertstate="firing", alertname!~"Watchdog|InfoInhibitor"}) or vector(0)
    valueExpr: humanizeCommas(result)
    colorExpr: 'result == 0.0 ? "green" : "orange"'
