# Image Factory schematic for the Ryzen AI Max+ 395 worker. Keep the storage
# extensions already used by the cluster and add both Strix Halo accelerator
# driver. The XDNA2 NPU extension is intentionally absent: as of 2026-11-05,
# Image Factory does not publish siderolabs/amd-npu for any released Talos
# version. Add it here only after the target Talos release resolves it.
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/amdgpu
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
