# Extra names on k-controlplane-1's API certificate, so talosctl can address it by
# hostname instead of by IP.
#
# Without this the handshake fails outright:
#
#   x509: certificate is valid for 192.168.x.x, not k-controlplane-1
#
# The certificate is issued for whatever is in certSANs, so a name that is not
# listed cannot be connected to no matter how well it resolves. DNS is
# necessary and not sufficient.
#
#   talosctl -n <ip-of-k-controlplane-1> patch mc --patch @talos/patches/nodes/k-controlplane-1/certsans.yaml
#   talosctl -n <ip-of-k-controlplane-1> get certsans          # confirm before switching
#   talosctl -n k-controlplane-1 version                       # then prove it by name
#
# Keep the IP listed alongside the names. Dropping it means a DNS outage takes
# the API with it, which is exactly when it is most wanted.
machine:
  certSANs:
    - k-controlplane-1
    # Add the FQDN too if short names do not resolve from where talosctl runs
    # -- a resolver with no search domain for the LAN will not find the bare
    # form.
    # - k-controlplane-1.j6n.internal
    # The address it already answers on. Adjust to this node's real IP; a
    # certSANs list that omits it silently narrows what can reach the node.
    # - 192.168.1.x
